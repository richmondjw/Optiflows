<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#003640">
<meta name="description" content="Working prototype for marketing intelligence dashboard — M2M Group">

<title>M2M Intelligence · Working prototype</title>

<style>
/* M2M Reporting Workbench — utility skin.
   Semtech ink/teal reduced to a commercial BI instrument: one accent, thin rules,
   dense tabular surfaces, no decoration. */
:root{
  --ink:#003640; --ink-2:#0f4a52; --teal:#00AFAA; --teal-d:#008985;
  --bg:#f6f8f8; --surface:#ffffff; --line:#dde5e5; --line-2:#c3d0d0;
  --txt:#15282c; --muted:#51666b; --faint:#7d9095;
  --good:#2c7a4b; --warn:#B45309; --alert:#AD0000;
  --good-bg:#e9f4ee; --warn-bg:#fdf2e5; --alert-bg:#fbeaea;
  --mono:'Consolas','SF Mono',ui-monospace,monospace;
  --z-drop:20; --z-top:30;
}
*{box-sizing:border-box;margin:0}
html{font-size:15px}
body{
  font-family:'Open Sans','Segoe UI',system-ui,sans-serif;color:var(--txt);
  background:var(--bg);min-height:100vh;display:flex;flex-direction:column;
}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--ink);color:#fff;padding:8px 14px;z-index:var(--z-top)}
.skip-link:focus{left:0}

/* ---- topbar ---- */
.topbar{
  display:flex;align-items:center;gap:18px;padding:0 16px;height:48px;
  background:var(--ink);color:#e8f1f1;position:sticky;top:0;z-index:var(--z-top);
}
.brand{font-size:14px;letter-spacing:.2px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand b{font-weight:700}
.mark{width:10px;height:10px;background:var(--teal);display:inline-block;border-radius:2px}
.bu-tabs{display:flex;gap:2px}
.bu-tabs button{
  background:transparent;border:1px solid transparent;color:#bfd4d4;font:inherit;font-size:12.5px;
  padding:5px 12px;cursor:pointer;border-radius:3px;
}
.bu-tabs button:hover{color:#fff;border-color:#2a5a60}
.bu-tabs button[aria-pressed="true"]{background:var(--teal);color:#00332f;font-weight:700}
.controls{display:flex;gap:8px;margin-left:auto;align-items:center}
.controls select,.controls input[type=date]{
  background:#0c434c;color:#dcebeb;border:1px solid #2a5a60;border-radius:3px;
  font:inherit;font-size:12px;padding:4px 8px;
}
.controls select:focus,.controls input:focus{outline:2px solid var(--teal);outline-offset:1px}
.conn{color:var(--teal);font-size:11px}
.conn.err{color:#ff9d9d}

/* ---- frame ---- */
.frame{display:flex;flex:1;min-height:0}
.rail{
  width:184px;flex:none;background:var(--surface);border-right:1px solid var(--line);
  padding:14px 0;position:sticky;top:48px;align-self:flex-start;height:calc(100vh - 48px);overflow-y:auto;
}
.rail a{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:7px 16px;color:var(--muted);text-decoration:none;font-size:13px;border-left:3px solid transparent;
}
.rail a:hover{color:var(--ink);background:var(--bg)}
.rail a.on{color:var(--ink);font-weight:700;border-left-color:var(--teal);background:var(--bg)}
.rail .sect{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:14px 16px 4px}
.main{flex:1;min-width:0;padding:20px 24px 60px;max-width:1280px}
.loading{color:var(--muted);padding:40px 0;font-size:13.5px}

/* ---- page head ---- */
.page-head{display:flex;align-items:baseline;gap:14px;margin-bottom:4px;flex-wrap:wrap}
.page-head h1{font-size:19px;font-weight:700;color:var(--ink)}
.page-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.range-echo{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* ---- KPI strip ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:18px}
.kpi{background:var(--surface);padding:10px 14px 12px;min-width:0}
.kpi .l{font-size:11px;color:var(--muted);letter-spacing:.02em;display:flex;gap:6px;align-items:center}
.kpi .v{font-size:21px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;margin:2px 0}
.kpi .d{font-size:11.5px;font-variant-numeric:tabular-nums}
.kpi .d.up{color:var(--good)} .kpi .d.dn{color:var(--alert)} .kpi .d.fl{color:var(--faint)}
.kpi .note{font-size:10.5px;color:var(--faint);line-height:1.35;margin-top:2px}

/* ---- chips ---- */
.chip{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.chip.hi{background:var(--good-bg);color:var(--good)}
.chip.mod{background:var(--warn-bg);color:var(--warn)}
.chip.lo{background:var(--alert-bg);color:var(--alert)}
.chip.na{background:#eef1f1;color:var(--faint)}
.tl{display:inline-block;min-width:26px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 4px;border-radius:3px;line-height:1.4;vertical-align:baseline}
.tl.g{background:var(--good-bg);color:var(--good)}
.tl.a{background:var(--warn-bg);color:var(--warn)}
.tl.r{background:var(--alert-bg);color:var(--alert)}

/* ---- panels & tables ---- */
.panel{background:var(--surface);border:1px solid var(--line);margin-bottom:16px}
.panel-head{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:13px;font-weight:700;color:var(--ink)}
.panel-head .spacer{flex:1}
.panel-body{padding:12px 14px}
.btn{
  background:var(--surface);border:1px solid var(--line-2);color:var(--muted);font:inherit;
  font-size:11.5px;padding:3px 10px;cursor:pointer;border-radius:3px;
}
.btn:hover{color:var(--ink);border-color:var(--ink-2)}
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:12.5px}
.tbl th{
  text-align:left;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.02em;
  padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;cursor:pointer;user-select:none;
  background:var(--surface);
}
/* NOTE: no sticky headers — a fixed top offset goes wrong whenever the topbar wraps
   or the source banner shows, and the floating header then covers rows (text
   appears cut off). Headers scroll with the table. */
.tbl th.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl th .arr{color:var(--teal-d);font-size:10px}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;line-height:1.45;vertical-align:middle}
.tbl tbody tr:hover{background:#f2f7f7}
.tbl td .bar{display:inline-block;height:9px;background:var(--teal);opacity:.75;vertical-align:middle;border-radius:1px;margin-right:6px}
.tbl .sub{color:var(--faint);font-size:11px}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--line-2);background:var(--bg)}

/* ---- funnel ---- */
.funnel-row{display:grid;grid-template-columns:26px 240px 1fr 120px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.funnel-row:last-child{border-bottom:0}
.funnel-row .band{font-family:var(--mono);font-size:10px;color:#fff;background:var(--ink-2);text-align:center;border-radius:2px;padding:2px 0}
.funnel-row .nm{font-size:12.5px}.funnel-row .nm small{display:block;color:var(--faint);font-size:10.5px}
.funnel-row .track{height:16px;background:var(--bg);border-radius:2px;overflow:hidden}
.funnel-row .fill{height:100%;background:var(--teal);border-radius:2px}
.funnel-row .val{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.funnel-row.ghost .nm,.funnel-row.ghost .val{color:var(--faint)}
.funnel-row.ghost .fill{background:repeating-linear-gradient(45deg,var(--line),var(--line) 4px,transparent 4px,transparent 8px)}
.funnel-row.ghost .band{background:var(--faint)}

/* ---- charts ---- */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line)}
.chart .axlab{font-size:10px;fill:var(--faint);font-family:var(--mono)}

/* ---- compare ---- */
.cmp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.cmp-grid{grid-template-columns:1fr}}
.cmp-col h3{font-size:13px;color:var(--ink);margin-bottom:2px}
.cmp-col .cur{font-size:11px;color:var(--faint);margin-bottom:8px}

/* ---- callouts ---- */
.callout{border:1px solid var(--line-2);background:var(--surface);padding:10px 14px;font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.callout.warn{border-color:#ecc9a0;background:var(--warn-bg);color:var(--warn)}
.callout b{color:var(--txt)}

/* ---- statusbar ---- */
.statusbar{
  position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);
  font-size:11px;color:var(--faint);padding:5px 16px;display:flex;gap:18px;font-family:var(--mono);
}
.statusbar .grow{flex:1}

@media (max-width:760px){
  .rail{display:none}
  .topbar{flex-wrap:wrap;height:auto;padding:8px 12px}
  .controls{margin-left:0;flex-wrap:wrap}
  .main{padding:14px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---- M2M Intelligence: register tabs, source banner, Report register ---- */
.register-tabs{display:flex;gap:0;border:1px solid #2a5a60;border-radius:4px;overflow:hidden}
.register-tabs button{background:transparent;border:0;color:#bfd4d4;font:inherit;font-size:12px;padding:5px 14px;cursor:pointer}
.register-tabs button[aria-pressed="true"]{background:#e8f1f1;color:var(--ink);font-weight:700}
.conn.snap{color:var(--warn)}
.src-banner{
  background:var(--warn-bg);color:var(--warn);border-bottom:1px solid #ecc9a0;
  font-size:12px;padding:6px 16px;text-align:center;
}
.panel.conf{border-color:#e0b4b4;border-width:2px}
.panel.conf .panel-head{background:var(--alert-bg)}
.panel.conf .panel-head h2{color:var(--alert)}

/* Report register: narrative typography inside the utility shell */
.register-report .page-head h1{font-size:24px}
.register-report .page-sub{font-size:14px;max-width:68ch;line-height:1.55}
.verdict{
  font-size:17px;line-height:1.6;color:var(--ink);max-width:72ch;
  padding:14px 18px;background:var(--surface);border:1px solid var(--line);
  border-top:3px solid var(--teal);margin-bottom:16px;
}
.dial-wrap{display:flex;gap:22px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:12px 18px;margin-bottom:16px;flex-wrap:wrap}
.dial{width:180px;flex:none}
.dial-none{color:var(--muted);font-size:13px;padding:12px}
.dial-side{flex:1;min-width:240px}
.dcomps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dcomp{font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:2px 8px;font-variant-numeric:tabular-nums}
.dcomp b{color:var(--ink);font-weight:600;margin-right:4px}
.dexcl{font-size:11px;color:var(--faint);line-height:1.6}
.lane-row{display:grid;grid-template-columns:220px 1fr 70px;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.lane-row:last-child{border-bottom:0}
.lane-l{font-size:12.5px}.lane-l small{display:block;color:var(--faint);font-size:10.5px}
.lane-t{height:14px;background:var(--bg);border-radius:2px;overflow:hidden}
.lane-f{height:100%;background:var(--teal);border-radius:2px}
.lane-n{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.mover{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.mover:last-child{border-bottom:0}
.mover b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.recs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.rec{padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.rec:last-child{border-bottom:0}
.rec b{color:var(--ink)} .rec small{display:block;color:var(--muted);margin-top:1px;line-height:1.45}
@media print{
  .topbar,.rail,.statusbar,.controls,.btn{display:none!important}
  .main{max-width:none;padding:0}
  .panel,.callout,.verdict{break-inside:avoid}
}

/* Compare scorecard: metric labels may wrap; value columns stay compact and even */
#tbl-cmp td:first-child{white-space:normal;min-width:200px;line-height:1.4}
#tbl-cmp td:first-child .sub{display:block;margin-top:1px}
#tbl-cmp th.num,#tbl-cmp td.num{width:150px}
#tbl-cmp td.num .tl{margin-left:6px}

/* channel-share donut */
.dnt-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dnt{width:170px;flex:none}
.dnt-legend{flex:1;min-width:150px}
.dnt-l{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:2.5px 0;color:var(--muted)}
.dnt-l i{width:9px;height:9px;border-radius:2px;flex:none}
.dnt-l b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink)}
@media (max-width:900px){.cmp-grid[style*="340px"]{grid-template-columns:1fr!important}}

/* Reporting Hub prototype marker. This intentionally differs from production-report chrome. */
.prototype-flag{display:inline-flex;align-items:center;align-self:stretch;padding:0 12px;background:#f1b744;color:#3e2d00;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
@media (max-width:760px){.topbar{height:auto;min-height:48px;flex-wrap:wrap;padding:8px 12px;gap:8px}.prototype-flag{padding:4px 7px;align-self:auto}.controls{margin-left:0;order:3;width:100%;overflow-x:auto}.rail{top:96px;height:calc(100vh - 96px)}}

</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="brand"><span class="mark"></span>M2M <b>Intelligence</b></div>
  <div class="prototype-flag">Working prototype for marketing intelligence dashboard</div>
  <nav class="register-tabs" id="register-tabs" aria-label="Register"></nav>
  <nav class="bu-tabs" id="bu-tabs" aria-label="Business unit"></nav>
  <div class="controls">
    <select id="ctl-period" aria-label="Period"></select>
    <span class="custom-range" id="custom-range" hidden>
      <input type="date" id="ctl-from" aria-label="From"> <input type="date" id="ctl-to" aria-label="To">
    </span>
    <select id="ctl-compare" aria-label="Comparison">
      <option value="none">No comparison</option>
      <option value="previous-period">vs previous period</option>
      <option value="previous-year">vs previous year</option>
    </select>
    <select id="ctl-attr" aria-label="Attribution model" title="Attribution model — changes how paid performance is counted">
      <option value="lead-creation">Attribution: lead creation</option>
      <option value="gclid-floor">Attribution: GCLID floor</option>
    </select>
  </div>
  <div class="conn" id="conn" title="Data engine connection">●</div>
</header>

<div class="src-banner" id="src-banner" hidden></div>

<div class="frame">
  <nav class="rail" id="rail" aria-label="Views"></nav>
  <main id="main" class="main" tabindex="-1">
    <div class="loading" id="loading">Connecting to the data engine…</div>
    <div id="content" hidden></div>
  </main>
</div>

/* ---------- month helpers ---------- */
const mkey = d => d.slice(0, 7);
const monthsIn = (from, to) => r => mkey(r.month_start) >= mkey(from) && mkey(r.month_start) <= mkey(to);
function monthList(from, to) {
  const out = []; let y = +from.slice(0, 4), m = +from.slice(5, 7);
  const ey = +to.slice(0, 4), em = +to.slice(5, 7);
  while (y < ey || (y === ey && m <= em)) { out.push(`${y}-${String(m).padStart(2, "0")}`); m++; if (m > 12) { m = 1; y++; } }
  return out;
}
function shiftMonth(ym, n) {
  let y = +ym.slice(0, 4), m = +ym.slice(5, 7) + n;
  while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
  return `${y}-${String(m).padStart(2, "0")}`;
}

/* ---------- core aggregate for one BU over a range ---------- */
function agg(bu, from, to, attribution) {
  const inR = monthsIn(from, to);
  const L = DB.rpt_lead_monthly.filter(r => r.bu_code === bu && inR(r));
  const S = DB.rpt_spend_monthly.filter(r => r.bu_code === bu && inR(r));
  const W = DB.rpt_web_monthly.filter(r => r.bu_code === bu && inR(r));
  const I = DB.rpt_impressions_monthly.filter(r => r.bu_code === bu && inR(r));
  const cfg = BUS.find(b => b.code === bu);
  const leads = L.reduce((a, r) => a + r.leads, 0);
  const mql = L.filter(r => r.is_mql).reduce((a, r) => a + r.leads, 0);
  const paid = L.filter(r => r.channel === "paid_search").reduce((a, r) => a + r.leads, 0);
  const spend = S.reduce((a, r) => a + (+r.spend), 0);
  const conv = S.reduce((a, r) => a + (+r.conversions), 0);
  const sessions = W.reduce((a, r) => a + r.sessions, 0);
  const keyEvents = W.reduce((a, r) => a + r.key_events, 0);
  const impressions = I.reduce((a, r) => a + (+r.impressions), 0);
  const qual = cfg && cfg.qual ? L.filter(r => cfg.qual.includes(r.status)).reduce((a, r) => a + r.leads, 0) : null;
  const untouched = cfg ? L.filter(r => r.status === cfg.untouched).reduce((a, r) => a + r.leads, 0) : 0;
  const attrLeads = attribution === "gclid-floor" ? paid : leads;
  return {
    bu, cfg, leads, mql, paid, spend, conv, sessions, keyEvents, impressions, qual, untouched,
    attrLeads,
    cpl: attrLeads ? spend / attrLeads : null,
    l2v: sessions ? leads / sessions : null,
    mqlRate: leads ? mql / leads : 0,
    gclidCov: leads ? paid / leads : 0,
    unworked: leads ? untouched / leads : 0,
    workedRate: leads ? 1 - untouched / leads : null,
    qualRate: qual != null && leads ? qual / leads : null,
    L, S, W,
  };
}

/* ---------- Pipeline Performance Index (dial v2) ----------
   Ported semantics from the deck's computeIndex: confidence-weighted composite,
   weights renormalised over included components, >=2-component floor, attribution
   coverage NEVER scored (context ring only). v2 note: the OUTCOME component is
   EXCLUDED until the pipeline/revenue joins land (monthly engine carries no
   deal/revenue facts) — disclosed in the output. Baselines = trailing 12 months
   immediately before the window start. */
function computeIndex(bu, from, to, attribution) {
  const baseFrom = shiftMonth(mkey(from), -12) + "-01";
  const baseTo = shiftMonth(mkey(from), -1) + "-28";
  const base = agg(bu, baseFrom, baseTo, attribution);
  const cur = agg(bu, from, to, attribution);
  const cfg = BUS.find(b => b.code === bu);
  const months = monthList(from, to).length;
  const comps = {}; const excluded = [];
  // demand: current monthly lead run-rate vs the baseline's COVERED-month run-rate.
  // Coverage = distinct baseline months with any lead data for this BU — dividing by a
  // hard 12 when history is shorter inflates demand exactly where the guard should bite.
  const baseCovered = new Set(DB.rpt_lead_monthly
    .filter(r => r.bu_code === bu && monthsIn(baseFrom, baseTo)(r)).map(r => mkey(r.month_start))).size;
  if (baseCovered >= 6 && base.leads > 0 && cur.leads != null && months) {
    comps.demand = Math.max(0, Math.min(100, Math.round((cur.leads / months) / Math.max(base.leads / baseCovered, 0.01) * 50)));
    if (baseCovered < 12) excluded.push(["demand-note", "baseline covers " + baseCovered + "/12 months — run-rate normalised to covered months"]);
  } else excluded.push(["demand", "baseline covers only " + baseCovered + "/12 months — insufficient history"]);
  // quality: qualified rate vs baseline qualified rate
  if (cur.qualRate != null && base.qualRate != null && base.qualRate > 0) {
    comps.quality = Math.max(0, Math.min(100, Math.round(cur.qualRate / base.qualRate * 50)));
  } else excluded.push(["quality", cfg && cfg.qual == null ? "statuses unworked (MMC process gap)" : "no qualified leads in window or baseline"]);
  // cost: baseline CPL vs current CPL (lower current = better)
  if (cur.cpl && base.cpl) {
    comps.cost = Math.max(0, Math.min(100, Math.round(base.cpl / cur.cpl * 50)));
  } else excluded.push(["cost", "no spend or no leads in window/baseline"]);
  // follow-up: worked rate (process proxy at monthly grain)
  if (cur.workedRate != null) {
    comps.follow = Math.round(cur.workedRate * 100);
  } else excluded.push(["follow", "no leads in window"]);
  // outcome: EXCLUDED in v2
  excluded.push(["outcome", "pipeline/revenue joins land in Phase 4 — component excluded, not faked"]);
  const W = { demand: 0.25, quality: 0.20, cost: 0.20, follow: 0.15 };
  const inc = Object.keys(comps);
  if (inc.length < 2) return { score: null, comps, excluded, reason: "fewer than 2 evidenced components — no score (floor rule)" };
  const wsum = inc.reduce((a, k) => a + W[k], 0);
  const score = Math.round(inc.reduce((a, k) => a + comps[k] * (W[k] / wsum), 0));
  const band = score >= 75 ? "on-track" : score >= 50 ? "watch" : "off-track";
  return { score, band, comps, excluded, gclidCov: cur.gclidCov, months };
}

function prevRangeOf(from, to, mode) {

  const n = ml.length;
  const pf = shiftMonth(mkey(from), -n) + "-01";
  const pt = shiftMonth(mkey(from), -1) + "-28";
  return [pf, pt];
}

/* ---------------- state (URL is truth) ---------------- */
function readState() {
  const p = new URLSearchParams(location.search);
  const s = {
    register: p.get("register") === "analyse" ? "analyse" : "report",
    view: p.get("view") || "",
    bu: p.get("bu") || "M2M_AU",
    period: p.get("period") || "fy27",
    from: p.get("from") || "",
    to: p.get("to") || "",
    compare: p.get("compare") || "none",
    attribution: p.get("attribution") || "lead-creation",
    sort: p.get("sort") || "",
    dir: p.get("direction") || "desc",
  };
  const valid = s.register === "report" ? CHAPTERS.map(c => c[0]) : ANALYSE_VIEWS.map(v => v[0]);
  if (!valid.includes(s.view)) s.view = valid[0];
  if (s.bu !== "GROUP" && !BUS.some(b => b.code === s.bu)) s.bu = "M2M_AU";
  const r = periodRange(s.period, s.from, s.to);
  s.from = r[0]; s.to = r[1];
  return s;
}
function periodRange(period, from, to) {
  if (period === "custom" && from && to) return [from, to];
  if (period === "fy26") return ["2025-02-01", "2026-01-31"];
  if (period === "t12") return [shiftMonth(mkey(SNAPSHOT), -11) + "-01", SNAPSHOT];
  if (period === "t24") return [shiftMonth(mkey(SNAPSHOT), -23) + "-01", SNAPSHOT];
  return ["2026-02-01", SNAPSHOT]; // fy27 default
}
function setState(patch, push) {
  const cur = readState();
  const s = Object.assign(cur, patch);
  if (patch.register && !patch.view) { s.view = ""; s.sort = ""; } // re-derive default view; sort keys are table-scoped
  const p = new URLSearchParams();
  p.set("register", s.register);
  if (s.view) p.set("view", s.view);
  p.set("bu", s.bu); p.set("period", s.period);
  if (s.period === "custom") { p.set("from", s.from); p.set("to", s.to); }
  p.set("compare", s.compare); p.set("attribution", s.attribution);
  if (s.sort) { p.set("sort", s.sort); p.set("direction", s.dir); }
  const url = "?" + p.toString();
  if (push === false) history.replaceState(null, "", url); else history.pushState(null, "", url);

/* ---------------- format helpers ---------------- */
const fmtI = n => n == null ? "—" : Math.round(n).toLocaleString("en-AU");
const fmtM = (n, cur) => n == null ? "—" : (cur || "$") + Math.round(n).toLocaleString("en-AU");
const fmtP = (n, d) => n == null ? "—" : (n * 100).toFixed(d == null ? 1 : d) + "%";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pm = d => { const [y, m] = d.split("-"); return ["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m] + " " + y.slice(2); };
const pd = d => { const [y, m, dd] = d.split("-"); return `${dd} ${["", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][+m]} ${y.slice(2)}`; };
function delta(cur, prev, invert) {
  if (prev == null || cur == null || !isFinite(prev) || prev === 0) return `<span class="d fl">— no prior</span>`;
  const pct = (cur - prev) / Math.abs(prev) * 100;
  if (Math.abs(pct) < 0.05) return `<span class="d fl">±0%</span>`;
  const good = invert ? pct < 0 : pct > 0;
  return `<span class="d ${good ? "up" : "dn"}">${pct > 0 ? "▲" : "▼"} ${Math.abs(pct).toFixed(1)}%</span>`;
}

/* ---------------- sortable tables ---------------- */
function sortable(tblId) {
  const tbl = document.getElementById(tblId);
  if (!tbl) return;
  tbl.querySelectorAll("th[data-k]").forEach(th => th.addEventListener("click", () => {
    const s = readState();
    const k = tblId + ":" + th.dataset.k;
    const dir = s.sort === k && s.dir === "desc" ? "asc" : "desc";
    setState({ sort: k, dir }, false);
  }));
  const s = readState();
  if (!s.sort || !s.sort.startsWith(tblId + ":")) return;
  const key = s.sort.split(":")[1];
  const th = tbl.querySelector(`th[data-k="${key}"]`);
  if (!th) return;
  const idx = [...th.parentNode.children].indexOf(th);
  const body = tbl.tBodies[0];
  const rows = [...body.rows];
  const num = th.classList.contains("num");
  rows.sort((a, b) => {
    const av = a.cells[idx].dataset.v != null ? a.cells[idx].dataset.v : a.cells[idx].textContent.trim();
    const bv = b.cells[idx].dataset.v != null ? b.cells[idx].dataset.v : b.cells[idx].textContent.trim();
    const c = num ? (parseFloat(av) || 0) - (parseFloat(bv) || 0) : String(av).localeCompare(String(bv));
    return s.dir === "asc" ? c : -c;
  });
  rows.forEach(r => body.appendChild(r));
  th.innerHTML += ` <span class="arr">${s.dir === "asc" ? "▲" : "▼"}</span>`;
}

/* ---------------- tiny SVG charts ---------------- */
function barChart(series, opts) {
  const W = 960, H = 200, mL = 44, mR = 46, mT = 10, mB = 26;
  const iw = W - mL - mR, ih = H - mT - mB;
  const maxV = Math.max(1, ...series.map(r => r.v));
  const maxV2 = opts && opts.line ? Math.max(1, ...series.map(r => r.v2 || 0)) : 0;
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / p) * p; };
  const mV = nice(maxV), mV2 = maxV2 ? nice(maxV2) : 0;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts && opts.label || "chart")}">`;
  for (let i = 0; i <= 3; i++) {
    const y = mT + ih - ih * i / 3;
    s += `<line class="gl" x1="${mL}" y1="${y}" x2="${W - mR}" y2="${y}"/>`;
    s += `<text class="axlab" x="${mL - 5}" y="${y + 3}" text-anchor="end">${fmtI(mV * i / 3)}</text>`;
    if (mV2) s += `<text class="axlab" x="${W - mR + 5}" y="${y + 3}">${(opts.lineFmt || fmtI)(mV2 * i / 3)}</text>`;
  }
  const n = series.length, step = iw / Math.max(n, 1), bw = Math.min(22, step * 0.6);
  series.forEach((r, i) => {
    const x = mL + step * i + (step - bw) / 2;
    const h = ih * r.v / mV;
    s += `<rect x="${x.toFixed(1)}" y="${(mT + ih - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h, r.v ? 1 : 0).toFixed(1)}" fill="var(--teal)" opacity=".8"><title>${r.m}: ${fmtI(r.v)}${r.v2 != null ? " · " + (opts.lineFmt || fmtI)(r.v2) : ""}</title></rect>`;
    if (i % 2 === 0 || n <= 13) s += `<text class="axlab" x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${r.m.slice(2)}</text>`;
  });
  if (mV2) {
    const pts = series.map((r, i) => `${(mL + step * i + step / 2).toFixed(1)},${(mT + ih - ih * (r.v2 || 0) / mV2).toFixed(1)}`).join(" ");
    s += `<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
  }
  return s + "</svg>";
}

    ${kpi("MQLs · website-origin", fmtI(A.mql) + ` <span class="sub" style="font-size:12px;color:var(--muted)">(${fmtP(A.mqlRate, 0)})</span>`, P ? delta(A.mql, P.mql) : "", "interim definition (17 Jul) — source-derived", CHIP.mod)}

    ${kpi("Cost per lead", A.cpl ? fmtM(A.cpl, cur) : "—", P && P.cpl ? delta(A.cpl, P.cpl, true) : "", attrNote, s.attribution === "gclid-floor" ? CHIP.lo : CHIP.mod)}
    ${kpi("Sessions", fmtI(A.sessions), P ? delta(A.sessions, P.sessions) : "", s.bu === "M2M_NZ" ? "⚠ NZ GA4 not report-grade (~70% Direct)" : null, s.bu === "M2M_NZ" ? CHIP.lo : CHIP.mod)}
    ${kpi("Visit → lead", fmtP(A.l2v, 2), P && P.l2v ? delta(A.l2v, P.l2v) : "", null, s.bu === "M2M_NZ" ? CHIP.lo : CHIP.mod)}
    ${A.qualRate != null ? kpi("Qualified rate", fmtP(A.qualRate, 0), P && P.qualRate != null ? delta(A.qualRate, P.qualRate) : "", null, CHIP.mod) : kpi("Qualified rate", "—", "", "MMC statuses unworked — stage unreportable until the process fix", CHIP.na)}
    ${kpi("Unworked leads", fmtP(A.unworked, 0), P ? delta(A.unworked, P.unworked, true) : "", `still in “${esc(A.cfg.untouched)}”`, A.unworked > 0.5 ? CHIP.lo : CHIP.mod)}
  </div>`;
  const ml = monthList(s.from, s.to);
  const byM = ml.map(m => ({
    m,
    v: A.L.filter(r => mkey(r.month_start) === m).reduce((a, r) => a + r.leads, 0),
    v2: A.S.filter(r => mkey(r.month_start) === m).reduce((a, r) => a + (+r.spend), 0),
  }));
  h += `<div class="panel"><div class="panel-head"><h2>Leads (bars) vs ad spend (line) · monthly</h2><div class="spacer"></div></div>
    <div class="panel-body">${barChart(byM, { label: "Leads vs spend", line: true, lineFmt: v => fmtM(v, cur) })}</div></div>`;
  const reds = DB.rpt_campaigns.filter(c => c.bu_code === s.bu && c.audit_health === "red" && c.status === "active");
  if (reds.length) h += `<div class="callout warn"><b>Attention:</b> ${reds.length} active campaign(s) carry a red audit flag — ${esc(reds.map(c => c.campaign_name).join(", "))}. See Campaigns.</div>`;
  h += `<div class="callout">Paid attribution is <b>modelled where noted</b>: GCLID-tracked figures are a floor, never total paid contribution. Platform-reported conversions are never counted as leads. Interim MQL = website-origin lead (source-derived, 17 Jul 2026).</div>`;
  return { title: "Overview", sub: "What happened — inbound demand, cost and quality at a glance.", html: h };
}

function vLeads(s) {
  const A = agg(s.bu, s.from, s.to, s.attribution);
  const rows = {};
  A.L.forEach(r => {
    const k = mkey(r.month_start) + "|" + r.channel + "|" + r.status + "|" + (r.is_mql ? 1 : 0);
    rows[k] = (rows[k] || 0) + r.leads;
  });
  const list = Object.entries(rows).map(([k, n]) => { const [m, ch, st, mq] = k.split("|"); return { m, ch, st, mq: mq === "1", n }; })
    .sort((a, b) => b.m.localeCompare(a.m) || b.n - a.n);
  let h = `<div class="callout">MQL ✓ = website-origin lead — <b>interim operational definition (17 Jul 2026), source-derived</b>. Monthly register at <b>month × channel × status</b> grain (${fmtI(A.leads)} leads in range). The row-level register with Zoho deep-links lands with the live Zoho sync. ${CONFIDENTIAL ? "" : "This build carries no PII; person-level drill stays in Zoho."}</div>`;
  h += `<div class="panel"><div class="panel-head"><h2>Lead register · monthly grain</h2><div class="spacer"></div><button class="btn" data-csv="tbl-leads" data-name="leads_${s.bu}_${s.from}_${s.to}.csv">Export CSV</button></div>
  <div class="tbl-wrap"><table class="tbl" id="tbl-leads"><thead><tr>
    <th data-k="m">Month</th><th data-k="ch">Channel</th><th data-k="st">Status (current)</th><th data-k="n" class="num">Leads</th><th data-k="mq">MQL</th>
  </tr></thead><tbody>`;
  const mx = Math.max(1, ...list.map(r => r.n));
  list.forEach(r => {
    const mql = r.mq;
    h += `<tr><td>${r.m}</td><td>${esc(r.ch)}</td><td>${esc(r.st)}</td>
      <td class="num" data-v="${r.n}"><span class="bar" style="width:${Math.max(2, r.n / mx * 60)}px"></span>${r.n}</td>
      <td>${mql ? "✓" : '<span class="sub">—</span>'}</td></tr>`;
  });
  h += `</tbody><tfoot><tr><td colspan="3">Total</td><td class="num">${fmtI(A.leads)}</td><td>${fmtI(A.mql)} MQL</td></tr></tfoot></table></div></div>`;
  // confidential drill — present ONLY in the -CONF build
  if (CONFIDENTIAL && window.__CONF_LEADS__ && s.bu !== "GROUP") {
    const cl = (window.__CONF_LEADS__[s.bu] || []).filter(x => mkey(x.d) >= mkey(s.from) && mkey(x.d) <= mkey(s.to)); // month-snapped like every aggregate
    h += `<div class="panel conf"><div class="panel-head"><h2>Contact drill · CONFIDENTIAL</h2><div class="spacer"></div><button class="btn" data-csv="tbl-conf" data-name="CONF_leads_${s.bu}.csv">Export CSV</button></div>
    <div class="tbl-wrap"><table class="tbl" id="tbl-conf"><thead><tr><th data-k="d">Date</th><th data-k="n">Name</th><th data-k="co">Company</th><th data-k="em">Email</th><th data-k="ph">Phone</th><th data-k="src">Source</th><th data-k="st">Status</th><th data-k="ow">Owner</th></tr></thead><tbody>`;
    cl.sort((a, b) => b.d.localeCompare(a.d)).forEach(x => {
      h += `<tr><td>${x.d}</td><td>${esc(x.name)}</td><td>${esc(x.co)}</td><td>${esc(x.em)}</td><td>${esc(x.ph)}</td><td>${esc(x.src)}</td><td>${esc(x.status)}</td><td>${esc(x.ow)}</td></tr>`;
    });
    h += `</tbody></table></div><div class="panel-body"><span class="sub">${cl.length} contacts · embedded from the audited extract, never from the platform. This file must not leave internal circulation.</span></div></div>`;
  }
  return { title: "Leads", sub: "Every marketing-generated lead in range, by month, channel and current CRM status.", html: h };
}

function vCampaigns(s) {
  const inR = monthsIn(s.from, s.to);
  const camps = DB.rpt_campaigns.filter(c => s.bu === "GROUP" || c.bu_code === s.bu);
  const spendRows = DB.rpt_spend_monthly.filter(r => (s.bu === "GROUP" || r.bu_code === s.bu) && inR(r));
  // keyed by BU|name — same-named campaigns in different BUs must never merge (A$ + NZ$ ban)
  const byName = {};
  spendRows.forEach(r => {
    const k = r.bu_code + "|" + r.campaign_name;
    const b = byName[k] = byName[k] || { spend: 0, clicks: 0, conv: 0, bu: r.bu_code, name: r.campaign_name };
    b.spend += +r.spend; b.clicks += r.clicks; b.conv += +r.conversions;
  });
  const names = new Set([...camps.map(c => c.bu_code + "|" + c.campaign_name), ...Object.keys(byName)]);
  const curOf = bu => (BUS.find(b => b.code === bu) || { cur: "$" }).cur;
  let h = `<div class="panel"><div class="panel-head"><h2>Campaign performance · registry-joined</h2><div class="spacer"></div><button class="btn" data-csv="tbl-camps" data-name="campaigns_${s.bu}.csv">Export CSV</button></div>
  <div class="tbl-wrap"><table class="tbl" id="tbl-camps"><thead><tr>
    <th data-k="n">Campaign</th><th data-k="b">BU</th><th data-k="st">Status</th><th data-k="h">Audit</th>
    <th data-k="bd" class="num">Budget/day</th><th data-k="sp" class="num">Spend</th><th data-k="cl" class="num">Clicks</th>
    <th data-k="cv" class="num">Platform conv.*</th><th data-k="cpc" class="num">CPC</th>
  </tr></thead><tbody>`;
  [...names].sort().forEach(k => {
    const [kbu, n] = [k.slice(0, k.indexOf("|")), k.slice(k.indexOf("|") + 1)];
    const reg = camps.find(c => c.bu_code === kbu && c.campaign_name === n);
    const sp = byName[k] || { spend: 0, clicks: 0, conv: 0, bu: kbu };
    if (!reg && !sp.spend) return;
    const cur = curOf(kbu);
    const health = reg ? reg.audit_health : null;
    const tl = health === "green" ? "g" : health === "yellow" ? "a" : health === "red" ? "r" : "";
    h += `<tr><td>${esc(n)}${reg ? "" : ' <span class="sub">(not in registry)</span>'}</td><td>${esc(kbu)}</td>
      <td>${reg ? esc(reg.status) : '<span class="sub">—</span>'}</td>
      <td>${tl ? `<span class="tl ${tl}">${esc(health)}</span>` : '<span class="sub">—</span>'}</td>
      <td class="num" data-v="${reg && reg.daily_budget || 0}">${reg && reg.daily_budget ? cur + reg.daily_budget : "—"}</td>
      <td class="num" data-v="${sp.spend.toFixed(2)}">${fmtM(sp.spend, cur)}</td>
      <td class="num" data-v="${sp.clicks}">${fmtI(sp.clicks)}</td>
      <td class="num" data-v="${sp.conv.toFixed(1)}">${sp.conv ? sp.conv.toFixed(0) : "—"}</td>
      <td class="num" data-v="${sp.clicks ? (sp.spend / sp.clicks).toFixed(2) : 0}">${sp.clicks ? cur + (sp.spend / sp.clicks).toFixed(2) : "—"}</td></tr>`;
  });
  h += `</tbody></table></div>
  <div class="panel-body"><span class="sub">*Platform-reported conversions are a bid-optimisation signal — <b>never counted as leads</b>. Lead-to-campaign joins land with the row-grain sync; until then per-campaign CPL is not printed. “(unattributed)” rows carry spend the platform cannot assign after the Feb-2025 AU account restructure.</span></div></div>`;
  return { title: "Campaigns", sub: "The paid lane in detail — registry intent meets platform delivery.", html: h };
}

function vFunnel(s) {
  const A = agg(s.bu, s.from, s.to, s.attribution);
  const rows = [
    { b: "M", n: "Ad impressions", sub: "paid lane only · calendar-month grain", v: A.impressions || null, ghost: !A.impressions },
    { b: "M", n: "Website visits", sub: "GA4 sessions, all channels" + (s.bu === "M2M_NZ" ? " · ⚠ not report-grade" : ""), v: A.sessions || null, ghost: !A.sessions },
    { b: "M", n: "On-page enquiries", sub: "GA4 key events — not CRM leads", v: A.keyEvents || null, ghost: !A.keyEvents },
    { b: "Q", n: "Leads", sub: "marketing-generated, CRM", v: A.leads },
    { b: "Q", n: "MQLs", sub: "website-origin · interim operational definition (17 Jul), source-derived", v: A.mql },
    { b: "S", n: "SQL / qualified", sub: A.qual != null ? "CRM qualified statuses" : "MMC statuses unworked — stage unreportable until the process fix", v: A.qual, ghost: A.qual == null },
    { b: "C", n: "Opportunities / customers", sub: "requires pipeline join — lands with zoho-pipeline-sync", v: null, ghost: true },
    { b: "$", n: "Revenue", sub: s.bu === "M2M_AU" ? "tracker billing actuals — lands with the revenue join (Phase 4)" : (s.bu === "MMC" ? "lives in MYOB — Phase 4 join" : "Xero NZ — Phase 4 join"), v: null, ghost: true },
  ];
  const mx = Math.max(1, ...rows.filter(r => r.v != null).map(r => r.v));
  let h = `<div class="panel"><div class="panel-body">`;
  rows.forEach(r => {
    const w = r.v != null ? Math.max(2, Math.log(r.v + 1) / Math.log(mx + 1) * 100) : 0;
    h += `<div class="funnel-row ${r.ghost ? "ghost" : ""}">
      <div class="band" title="${{ M: "Marketing performance", Q: "Lead quality", S: "Sales follow-up", C: "CRM progression", $: "Commercial outcome" }[r.b]}">${r.b}</div>
      <div class="nm">${esc(r.n)}<small>${r.sub}</small></div>
      <div class="track"><div class="fill" style="width:${w}%"></div></div>
      <div class="val">${r.v != null ? fmtI(r.v) : "no data — gap"}</div></div>`;
  });
  h += `</div></div>
  <div class="callout">Bands: <b>M</b> marketing performance · <b>Q</b> lead quality · <b>S</b> sales follow-up · <b>C</b> CRM progression · <b>$</b> commercial outcome — a leak is owned by the band it sits in. Ghost stages state their reason; nothing is bridged by an invented number. Top-of-funnel rows use calendar-month grain.</div>`;
  return { title: "Funnel", sub: "The eight stages — measured where evidence exists, an explicit gap where it doesn't.", html: h };
}

function vCompare(s) {
  // the CPL row is PINNED to lead-creation: under the GCLID floor a cross-BU CPL
  // index ranks tracking coverage, not efficiency — never comparable
  const cols = BUS.map(b => agg(b.code, s.from, s.to, "lead-creation"));
  const best = {
    cpl: Math.min(...cols.filter(c => c.cpl).map(c => c.cpl)),
    l2v: Math.max(...cols.map(c => c.l2v || 0)),
    mql: Math.max(...cols.map(c => c.mqlRate)),
    gclid: Math.max(...cols.map(c => c.gclidCov)),
    worked: Math.max(...cols.map(c => 1 - c.unworked)),
    qual: Math.max(...cols.filter(c => c.qualRate != null).map(c => c.qualRate), 0),
  };
  const idx = (v, b, invert) => v == null || !b ? null : Math.round((invert ? b / v : v / b) * 100);
  const cell = (raw, i) => `<td class="num" data-v="${i == null ? -1 : i}">${raw} ${i != null ? `<span class="tl ${i >= 90 ? "g" : i >= 60 ? "a" : "r"}">${i}</span>` : '<span class="chip na">N/A</span>'}</td>`;
  let h = `<div class="panel"><div class="panel-head"><h2>Indexed scorecard · best BU = 100</h2><div class="spacer"></div><button class="btn" data-csv="tbl-cmp" data-name="compare_${s.from}_${s.to}.csv">Export CSV</button></div>
  <div class="tbl-wrap"><table class="tbl" id="tbl-cmp"><thead><tr><th>Metric</th>${cols.map(c => `<th class="num">${esc(c.cfg.label)}</th>`).join("")}</tr></thead><tbody>`;
  h += `<tr><td><b>Cost per lead</b> <span class="sub">modelled blend · lower better</span></td>${cols.map(c => cell(c.cpl ? c.cfg.cur + Math.round(c.cpl) : "—", idx(c.cpl, best.cpl, true))).join("")}</tr>`;
  h += `<tr><td><b>Visit → lead conversion</b></td>${cols.map(c => cell(fmtP(c.l2v, 2), idx(c.l2v, best.l2v))).join("")}</tr>`;
  h += `<tr><td><b>MQL rate</b> <span class="sub">website-origin, interim</span></td>${cols.map(c => cell(fmtP(c.mqlRate, 0), idx(c.mqlRate, best.mql))).join("")}</tr>`;
  h += `<tr><td><b>Attribution coverage</b> <span class="sub">GCLID</span></td>${cols.map(c => cell(fmtP(c.gclidCov, 0), idx(c.gclidCov, best.gclid))).join("")}</tr>`;
  h += `<tr><td><b>Worked-lead rate</b> <span class="sub">left the entry status</span></td>${cols.map(c => cell(fmtP(1 - c.unworked, 0), idx(1 - c.unworked, best.worked))).join("")}</tr>`;
  h += `<tr><td><b>Qualified rate</b></td>${cols.map(c => cell(c.qualRate != null ? fmtP(c.qualRate, 0) : "—", c.qualRate != null ? idx(c.qualRate, best.qual) : null)).join("")}</tr>`;
  h += `</tbody></table></div>
  <div class="panel-body"><span class="sub">Only rates and unit costs cross business units — absolute volumes never compare (different market sizes). Green ≥90 · amber 60–89 · red &lt;60. The CPL row is pinned to the lead-creation model — a GCLID-floor CPL is never comparable across BUs (it ranks tracking coverage, not efficiency) — and compares NZ$ to A$ numerically (≈7% FX gap), so treat it as indicative. Worked-lead rate is a process proxy; MMC's number is the finding, not noise.</span></div></div>`;
  h += `<div class="cmp-grid">` + cols.map(c => {
    const ml = monthList(s.from, s.to);
    const byM = ml.map(m => ({ m, v: c.L.filter(r => mkey(r.month_start) === m).reduce((a, r) => a + r.leads, 0) }));
    return `<div class="cmp-col panel"><div class="panel-body"><h3>${esc(c.cfg.label)}</h3><div class="cur">${fmtI(c.leads)} leads · ${c.cfg.cur}${fmtI(c.spend)} spend</div>${barChart(byM, { label: c.cfg.label + " leads" })}</div></div>`;
  }).join("") + `</div>`;
  return { title: "Compare BUs", sub: "Efficiency, not volume — every BU indexed to the group's best performer.", html: h };
}

function vChannels(s) {
  const A = agg(s.bu, s.from, s.to, s.attribution);
  // GA4 channel -> marketing bucket
  const BUCKET = ch => /paid search|paid video|display|cross-network/i.test(ch) ? "Paid"
    : /organic search|organic shopping|organic video/i.test(ch) ? "Organic"
    : /organic social/i.test(ch) ? "Social"
    : /email/i.test(ch) ? "Email"
    : /referral/i.test(ch) ? "Referral"
    : /direct/i.test(ch) ? "Direct" : "Other";
  const B = {};
  A.W.forEach(r => { const b = B[BUCKET(r.channel)] = B[BUCKET(r.channel)] || { s: 0, k: 0 }; b.s += r.sessions; b.k += r.key_events; });
  const totalK = Object.values(B).reduce((a, b) => a + b.k, 0) || 1;
  const inR = monthsIn(s.from, s.to);
  const emailClicks = DB.rpt_email_campaigns
    .filter(r => r.bu_code === s.bu && mkey(r.send_date) >= mkey(s.from) && mkey(r.send_date) <= mkey(s.to))
    .reduce((a, r) => a + r.clicks, 0);
  const webFormLeads = A.L.filter(r => r.channel === "web_form").reduce((a, r) => a + r.leads, 0);
  const order = ["Paid", "Organic", "Direct", "Email", "Social", "Referral", "Other"];
  const rows = order.filter(k => B[k]).map(k => {
    const b = B[k];
    const rate = b.s ? b.k / b.s : 0;
    let tracked = "—", trackedNote = "";
    if (k === "Paid") { tracked = fmtI(A.paid); trackedNote = "GCLID floor"; }
    if (k === "Email") { tracked = fmtI(emailClicks) + " clicks"; trackedNote = "influence, never leads"; }
    const modelled = Math.round(webFormLeads * (b.k / totalK));
    return { name: k, sess: b.s, enq: b.k, rate, tracked, trackedNote, modelled };
  }).sort((a, b) => b.rate - a.rate);
  const bestRate = rows.length ? rows[0].rate : 0;
  let h = "";
  if (s.bu === "M2M_NZ") h += `<div class="callout warn">⚠ NZ GA4 is <b>not report-grade</b> (~70% Direct) — channel splits here are directional only.</div>`;
  h += `<div class="verdict" style="font-size:14.5px">Measured to the <b>enquiry</b> stage (GA4, tracked), <b>${rows.length ? esc(rows[0].name) : "—"}</b> converts highest for ${esc(A.cfg.label)} at <b>${fmtP(bestRate, 2)}</b> session→enquiry. Channel-to-<b>customer</b> attribution is only tracked for Paid (GCLID floor) — the UTM capture fix unlocks the rest.</div>`;
  h += `<div class="panel"><div class="panel-head"><h2>Channel scorecard — tracked first, modelled clearly marked</h2><div class="spacer"></div><button class="btn" data-csv="tbl-chan" data-name="channels_${s.bu}.csv">Export CSV</button></div>
  <div class="tbl-wrap"><table class="tbl" id="tbl-chan"><thead><tr>
    <th data-k="c">Channel</th><th data-k="s" class="num">Sessions</th><th data-k="k" class="num">Enquiries (GA4)</th>
    <th data-k="r" class="num">Enquiry rate · TRACKED</th><th data-k="t" class="num">Lead-level · tracked</th>
    <th data-k="m" class="num">Lead allocation · MODELLED</th>
  </tr></thead><tbody>`;
  const mx = Math.max(0.0001, ...rows.map(r => r.rate));
  rows.forEach(r => {
    h += `<tr><td><b>${esc(r.name)}</b></td>
      <td class="num" data-v="${r.sess}">${fmtI(r.sess)}</td>
      <td class="num" data-v="${r.enq}">${fmtI(r.enq)}</td>
      <td class="num" data-v="${r.rate}"><span class="bar" style="width:${Math.max(2, r.rate / mx * 70)}px"></span>${fmtP(r.rate, 2)}</td>
      <td class="num">${r.tracked}${r.trackedNote ? ` <span class="sub">${r.trackedNote}</span>` : ""}</td>
      <td class="num" data-v="${r.modelled}">~${fmtI(r.modelled)} <span class="chip lo">MODELLED</span></td></tr>`;
  });
  h += `</tbody></table></div>
  <div class="panel-body"><span class="sub">Modelled column: the ${fmtI(webFormLeads)} web-form leads (channel-unknown at lead level) allocated in proportion to each channel's share of GA4 enquiries — a method, not a measurement. Paid's tracked floor and its modelled allocation overlap; never sum the two columns.</span></div></div>`;
  h += `<div class="cmp-grid" style="grid-template-columns:340px 1fr"><div class="panel"><div class="panel-head"><h2>Enquiry share by channel</h2></div>
    <div class="panel-body">${donutSVG(rows.map(r => ({ l: r.name, v: r.enq })), { label: "enquiry share", centre: "enquiries" })}</div></div>
  <div class="panel"><div class="panel-head"><h2>What converts to revenue — tracked, by origin source</h2>
    </div><div class="panel-body">${s.bu === "M2M_AU"
      ? `<div style="font-size:12.5px;line-height:1.7">${REV.by_src.slice(0, 5).map(r =>
          `<div class="mover"><span>${esc(r.src)}</span><b>${fmtM(r.rev, "A$")} · ${r.converted} customers</b></div>`).join("")}
        <p class="sub" style="margin-top:8px">Origin source (form/referral/call) is the tracked conversion truth today — it names the door, not the marketing channel that drove someone to it. See ROI for the full table.</p></div>`
      : `<div class="sub" style="padding:14px 0">Revenue joins for this BU land in Phase 4 (MYOB / Xero NZ).</div>`}</div></div></div>`;
  h += `<div class="callout warn"><b>The unlock:</b> the same hidden-field fix that captures GCLID can capture <b>utm_source / utm_medium / utm_campaign + referrer</b> on every form — one SQiBLE change, and email vs paid vs organic vs social becomes tracked at the <b>lead</b> level, which then joins to Jane's revenue data at the <b>customer</b> level. Work-order addendum issued ${pd("2026-07-20")}.</div>`;
  return { title: "Channels", sub: "Email vs paid vs organic vs social — what each channel converts, measured where tracking exists and modelled where it doesn't.", html: h };
}

function vROI(s) {
  if (s.bu !== "M2M_AU") {
    return { title: "ROI", sub: "Return on ad spend — revenue-joined.", html:
      `<div class="panel"><div class="panel-body" style="color:var(--faint);padding:28px 14px">` +
      (s.bu === "MMC" ? "MMC revenue lives in MYOB — the ROI view lights up with the Phase 4 finance join."
        : s.bu === "M2M_NZ" ? "NZ revenue lives in Xero NZ — the ROI view lights up with the Phase 4 finance join. (NZ's 4 CRM deals carry NZ$113k but are not billing-joined.)"
        : "Cross-BU ROI needs every BU's finance join — Phase 4.") + `</div></div>` };
  }
  const asofM = REV.cum[REV.cum.length - 1].asof.slice(0, 7);
  const A = agg("M2M_AU", "2026-02-01", asofM + "-28", s.attribution);
  const revNow = REV.cum[REV.cum.length - 1].rev;
  const conv = REV.cum[REV.cum.length - 1].converted;
  // monthly billing deltas from the cumulative snapshots (last row can duplicate)
  const cum = REV.cum.filter((c, i, a) => i === 0 || c.rev !== a[i - 1].rev || c.asof.slice(0, 7) !== a[i - 1].asof.slice(0, 7));
  const deltas = cum.slice(1).map((c, i) => ({ m: cum[i].asof.slice(0, 7), v: Math.round(c.rev - cum[i].rev) }));
  const runRate = deltas.length ? deltas[deltas.length - 1].v : 0; // latest full month's billing from the FY27 cohort
  const spend = A.spend;
  const realised = spend ? revNow / spend : null;
  const annual = runRate * 12;
  const HZ = [1, 3, 5], RET = [[0.95, "95%/yr retention"], [0.85, "85%/yr"], [0.70, "70%/yr"]];
  const horizon = (H, r) => { let t = 0; for (let y = 0; y < H; y++) t += annual * Math.pow(r, y); return t / spend; };
  let h = `<div class="kpis">
    ${kpi("Revenue banked · FY27 cohort", fmtM(revNow, "A$"), "", `${conv} net-new customers billed to ${pd(REV.asof)} · Jasper actuals`, CHIP.hi)}
    ${kpi("Realised return so far", realised ? "$1 → $" + realised.toFixed(2) : "—", "", "revenue banked ÷ FY27 ad spend to " + asofM + " — TRACKED, but the cohort is young: recurring billing keeps accruing", CHIP.hi)}
    ${kpi("Recurring run-rate acquired", fmtM(runRate, "A$") + "/mo", "", "latest full month's billing from this year's new customers", CHIP.mod)}
    ${kpi("Run-rate return", spend ? "$1 → $" + (annual / spend).toFixed(2) + "/yr" : "—", "", "annualised run-rate ÷ spend — MODELLED: assumes the cohort's billing persists", CHIP.lo)}
  </div>`;
  h += `<div class="panel"><div class="panel-head"><h2>Projected return per $1 · horizon × retention scenarios</h2></div>
  <div class="tbl-wrap"><table class="tbl" id="tbl-roi"><thead><tr><th>Scenario (MODELLED)</th>${HZ.map(H2 => `<th class="num">${H2} year${H2 > 1 ? "s" : ""}</th>`).join("")}</tr></thead><tbody>`;
  RET.forEach(([r, lab]) => {
    h += `<tr><td>${lab}</td>${HZ.map(H2 => `<td class="num">$1 → <b>$${horizon(H2, r).toFixed(2)}</b></td>`).join("")}</tr>`;
  });
  h += `</tbody></table></div>
  <div class="panel-body"><span class="sub">Model: the FY27 cohort's current monthly billing (${fmtM(runRate, "A$")}/mo) persists and decays only by the retention assumption; no growth from further conversions is projected. Connectivity revenue is recurring — this is why ROI must be read over horizons, not in-period. These are scenarios, never forecasts. Spend base: FY27 ad spend to ${asofM} (${fmtM(spend, "A$")}).</span></div></div>`;
  const bars = deltas.map(d => ({ m: d.m, v: d.v }));
  h += `<div class="panel"><div class="panel-head"><h2>Net-new billing by month (cumulative deltas) vs the +$9,450/mo baseline</h2></div>
  <div class="panel-body">${barChart(bars, { label: "billing" })}</div>
  <div class="panel-body"><span class="sub">Baseline: the Sales Director's +$${fmtI(REV.baseline_monthly)}/mo net-new target.</span></div></div>`;
  const WEBSRC = /form|download|website|get connected|contact|iot experts|air time/i;
  h += `<div class="panel"><div class="panel-head"><h2>Revenue by origin source · tracked to ${pd(REV.by_src_asof)}</h2><div class="spacer"></div><button class="btn" data-csv="tbl-roisrc" data-name="roi_by_source.csv">Export CSV</button></div>
  <div class="tbl-wrap"><table class="tbl" id="tbl-roisrc"><thead><tr><th data-k="s">Source</th><th data-k="w">Website-origin</th><th data-k="r" class="num">Revenue</th><th data-k="c" class="num">Converted</th><th data-k="l" class="num">Leads (register)</th><th data-k="rl" class="num">Rev / lead</th></tr></thead><tbody>`;
  REV.by_src.forEach(r => {
    const web = WEBSRC.test(r.src);
    h += `<tr><td>${esc(r.src)}</td><td>${web ? "✓" : '<span class="sub">—</span>'}</td>
      <td class="num" data-v="${r.rev}">${fmtM(r.rev, "A$")}</td><td class="num" data-v="${r.converted}">${r.converted}</td>
      <td class="num" data-v="${r.leads}">${r.leads}</td>
      <td class="num" data-v="${r.leads ? r.rev / r.leads : 0}">${r.leads ? fmtM(r.rev / r.leads, "A$") : "—"}</td></tr>`;
  });
  h += `</tbody></table></div>
  <div class="panel-body"><span class="sub">Source join is the Sales Director's — origin lead source at creation. ✓ = website-origin (the interim MQL rule). Rev/lead mixes cohort vintages — directional. Per-campaign ROI needs the row-grain lead↔campaign join (n8n sync).</span></div></div>`;
  h += `<div class="callout">All horizon figures are <b>modelled scenarios</b> and never blend into tracked KPIs. Revenue is AU only until the MYOB (MMC) and Xero NZ joins land in Phase 4.</div>`;
  return { title: "ROI — return on ad spend", sub: "For every dollar spent: what came back, what recurs, and what that compounds to over 1–5 years.", html: h };
}

function vEmail(s) {
  const inR = monthsIn(s.from, s.to);
  const camps = DB.rpt_email_campaigns
    .filter(r => (s.bu === "GROUP" || r.bu_code === s.bu) && mkey(r.send_date) >= mkey(s.from) && mkey(r.send_date) <= mkey(s.to))
    .sort((a, b) => b.send_date.localeCompare(a.send_date));
  const T = k => camps.reduce((a, r) => a + r[k], 0);
  const sent = T("sent"), opens = T("opens"), clicks = T("clicks"), bounces = T("bounces"), unsubs = T("unsubs");
  const br = sent ? bounces / sent : 0;
  // dashboard
  let h = `<div class="kpis">
    ${kpi("Campaigns sent", fmtI(camps.length), "", null, CHIP.hi)}
    ${kpi("Emails delivered", fmtI(sent - bounces), "", fmtI(sent) + " sent − " + fmtI(bounces) + " bounced", CHIP.hi)}
    ${kpi("Open rate", sent ? fmtP(opens / sent, 1) : "—", "", "B2B benchmark ~21–25%", CHIP.mod)}
    ${kpi("Click rate", sent ? fmtP(clicks / sent, 1) : "—", "", null, CHIP.mod)}
    ${kpi("Bounce rate", sent ? fmtP(br, 1) : "—", "", br > 0.05 ? "list hygiene flag — cleanse before the next wave" : null, br > 0.05 ? CHIP.lo : CHIP.mod)}
    ${kpi("Unsubscribes", fmtI(unsubs), "", null, CHIP.mod)}
  </div>`;
  const ml = monthList(s.from, s.to);
  const byM = ml.map(m => {
    const cs = camps.filter(r => mkey(r.send_date) === m);
    return { m, v: cs.reduce((a, r) => a + r.sent, 0), v2: cs.reduce((a, r) => a + r.opens, 0) };
  });
  h += `<div class="panel"><div class="panel-head"><h2>Send volume (bars) and opens (line) · monthly</h2></div>
  <div class="panel-body">${barChart(byM, { label: "email volume", line: true })}</div></div>`;
  // list intelligence
  const byList = {};
  camps.forEach(r => { const b = byList[r.list_name || "(unknown)"] = byList[r.list_name || "(unknown)"] || { n: 0, sent: 0, opens: 0, bounces: 0, last: "" }; b.n++; b.sent += r.sent; b.opens += r.opens; b.bounces += r.bounces; if (r.send_date > b.last) b.last = r.send_date; });
  h += `<div class="panel"><div class="panel-head"><h2>List intelligence</h2></div>
  <div class="tbl-wrap"><table class="tbl" id="tbl-elists"><thead><tr><th data-k="l">List</th><th data-k="n" class="num">Campaigns</th><th data-k="s" class="num">Avg send size</th><th data-k="o" class="num">Open rate</th><th data-k="b" class="num">Bounce rate</th><th data-k="d">Last used</th></tr></thead><tbody>`;
  Object.entries(byList).sort((a, b) => b[1].sent - a[1].sent).forEach(([l, v]) => {
    const lbr = v.sent ? v.bounces / v.sent : 0;
    h += `<tr><td>${esc(l)}</td><td class="num" data-v="${v.n}">${v.n}</td><td class="num" data-v="${Math.round(v.sent / v.n)}">${fmtI(v.sent / v.n)}</td>
      <td class="num" data-v="${v.sent ? v.opens / v.sent : 0}">${v.sent ? fmtP(v.opens / v.sent, 1) : "—"}</td>
      <td class="num" data-v="${lbr}">${v.sent ? fmtP(lbr, 1) : "—"}${lbr > 0.05 ? ' <span class="tl r">!</span>' : ""}</td>
      <td>${v.last}</td></tr>`;
  });
  h += `</tbody></table></div><div class="panel-body"><span class="sub">Health of the audience, not the message: high bounce = stale addresses (7.6–13.8% backlog across the accounts); NZ operational-notice lists (outages, migrations) should be read separately from marketing sends.</span></div></div>`;
  // campaign register drill
  h += `<div class="panel"><div class="panel-head"><h2>Campaign register — the drill</h2><div class="spacer"></div><button class="btn" data-csv="tbl-ecamps" data-name="email_campaigns_${s.bu}.csv">Export CSV</button></div>
  <div class="tbl-wrap"><table class="tbl" id="tbl-ecamps"><thead><tr>
    <th data-k="d">Sent</th><th data-k="t">Campaign</th><th data-k="b">BU</th><th data-k="l">List</th>
    <th data-k="s" class="num">Sent</th><th data-k="o" class="num">Open %</th><th data-k="c" class="num">Click %</th><th data-k="bn" class="num">Bounce %</th><th data-k="u" class="num">Unsubs</th>
  </tr></thead><tbody>`;
  camps.forEach(r => {
    const orr = r.sent ? r.opens / r.sent : 0, crr = r.sent ? r.clicks / r.sent : 0, brr = r.sent ? r.bounces / r.sent : 0;
    h += `<tr><td>${r.send_date}</td><td title="${esc(r.title)}">${esc(r.title.length > 46 ? r.title.slice(0, 45) + "…" : r.title)}</td><td>${esc(r.bu_code)}</td>
      <td>${esc(r.list_name || "")}</td>
      <td class="num" data-v="${r.sent}">${fmtI(r.sent)}</td>
      <td class="num" data-v="${orr}">${r.sent ? fmtP(orr, 1) : "—"}</td>
      <td class="num" data-v="${crr}">${r.sent ? fmtP(crr, 1) : "—"}</td>
      <td class="num" data-v="${brr}">${r.sent ? fmtP(brr, 1) : "—"}${brr > 0.05 ? ' <span class="tl r">!</span>' : ""}</td>
      <td class="num" data-v="${r.unsubs}">${r.unsubs}</td></tr>`;
  });
  h += `</tbody></table></div></div>`;
  h += `<div class="callout"><b>Email is an influence signal.</b> Opens and clicks are touches on the existing database — never counted as leads. Re-sends are separate campaigns by design (their lower rates are the non-opener remainder, not decay).</div>`;
  return { title: "Email", sub: "The list's performance at the top; every individual campaign underneath.", html: h };
}

function vWebsite(s) {
  const A = agg(s.bu, s.from, s.to, s.attribution);
  const doCmp = s.compare !== "none";
  const [pf, pt] = prevRangeOf(s.from, s.to, s.compare);
  const P = doCmp ? agg(s.bu, pf, pt, s.attribution) : null;
  const byCh = {};
  A.W.forEach(r => { const b = byCh[r.channel] = byCh[r.channel] || { s: 0, k: 0 }; b.s += r.sessions; b.k += r.key_events; });
  const list = Object.entries(byCh).map(([ch, v]) => ({ ch, ...v })).sort((a, b) => b.s - a.s);
  const paidShare = A.sessions ? (byCh["Paid Search"] ? byCh["Paid Search"].s : 0) / A.sessions : 0;
  const orgShare = A.sessions ? (byCh["Organic Search"] ? byCh["Organic Search"].s : 0) / A.sessions : 0;
  let h = "";
  if (s.bu === "M2M_NZ") h += `<div class="callout warn">⚠ NZ GA4 is <b>not report-grade</b> (~70% Direct — tagging issue on the audit list). Directional only.</div>`;
  h += `<div class="kpis">
    ${kpi("Sessions", fmtI(A.sessions), P ? delta(A.sessions, P.sessions) : "", null, s.bu === "M2M_NZ" ? CHIP.lo : CHIP.mod)}
    ${kpi("On-page enquiries", fmtI(A.keyEvents), P ? delta(A.keyEvents, P.keyEvents) : "", "GA4 key events — not CRM leads", CHIP.mod)}
    ${kpi("Enquiry rate", A.sessions ? fmtP(A.keyEvents / A.sessions, 2) : "—", P && P.sessions ? delta(A.keyEvents / A.sessions, P.keyEvents / P.sessions) : "", null, CHIP.mod)}
    ${kpi("Visit → lead", fmtP(A.l2v, 2), P && P.l2v ? delta(A.l2v, P.l2v) : "", "CRM leads ÷ sessions", CHIP.mod)}
    ${kpi("Paid share of traffic", fmtP(paidShare, 1), P ? delta(paidShare, P.sessions ? (P.W.filter(r => r.channel === "Paid Search").reduce((a, r) => a + r.sessions, 0)) / P.sessions : null) : "", null, CHIP.mod)}
    ${kpi("Organic share", fmtP(orgShare, 1), "", "organic queries arrive with the GSC connection (ask #14)", CHIP.mod)}
  </div>`;
  h += `<div class="cmp-grid" style="grid-template-columns:340px 1fr"><div class="panel"><div class="panel-head"><h2>Channel share</h2></div>
    <div class="panel-body">${donutSVG(list.map(r => ({ l: r.ch, v: r.s })), { label: "channel share", centre: "sessions" })}</div></div>
  <div class="panel"><div class="panel-head"><h2>Traffic over time · sessions (bars) and enquiries (line)</h2></div>
    <div class="panel-body">${barChart(monthList(s.from, s.to).map(m => ({
      m,
      v: A.W.filter(r => mkey(r.month_start) === m).reduce((a, r) => a + r.sessions, 0),
      v2: A.W.filter(r => mkey(r.month_start) === m).reduce((a, r) => a + r.key_events, 0),
    })), { label: "traffic", line: true })}</div></div></div>`;
  h += `<div class="panel"><div class="panel-head"><h2>Sessions by channel</h2><div class="spacer"></div><button class="btn" data-csv="tbl-web" data-name="website_${s.bu}.csv">Export CSV</button></div>
  <div class="tbl-wrap"><table class="tbl" id="tbl-web"><thead><tr><th data-k="c">Channel</th><th data-k="s" class="num">Sessions</th><th data-k="k" class="num">Key events</th><th data-k="r" class="num">Event rate</th></tr></thead><tbody>`;
  const mx = Math.max(1, ...list.map(r => r.s));
  list.forEach(r => {
    h += `<tr><td>${esc(r.ch)}</td><td class="num" data-v="${r.s}"><span class="bar" style="width:${Math.max(2, r.s / mx * 80)}px"></span>${fmtI(r.s)}</td>

  h += `</tbody></table></div>
  <div class="panel-body"><span class="sub">Landing-page detail and organic-search queries land with the ga4-sync workflow and the GSC connection (stakeholder ask #14). Key events are on-page actions, not CRM leads. Set a comparison in the top bar to light up the deltas.</span></div></div>`;
  return { title: "Website", sub: "Where the traffic comes from, how it trends, and what it does.", html: h };
}

const ANALYSE_RENDERERS = { overview: vOverview, leads: vLeads, campaigns: vCampaigns, channels: vChannels, roi: vROI, funnel: vFunnel, compare: vCompare, email: vEmail, website: vWebsite, quality: vQuality };

function render() {
  const s = readState();

  if (regs) regs.innerHTML =
    `<button type="button" data-register="report" aria-pressed="${s.register === "report"}">Report</button>` +
    `<button type="button" data-register="analyse" aria-pressed="${s.register === "analyse"}">Analyse</button>`;

    `<button type="button" aria-pressed="${s.bu === b.code}" data-bu="${b.code}">${b.code === "GROUP" ? "Group" : esc(b.label)}</button>`).join("");
  const per = document.getElementById("ctl-period");
  per.innerHTML = PERIODS.map(([k, l]) => `<option value="${k}" ${s.period === k ? "selected" : ""}>${l}</option>`).join("");
  document.getElementById("custom-range").hidden = s.period !== "custom";
  document.getElementById("ctl-from").value = s.from;
  document.getElementById("ctl-to").value = s.to;
  document.getElementById("ctl-compare").value = s.compare;
  document.getElementById("ctl-attr").value = s.attribution;
  // group fallback FIRST — the rail must highlight what actually renders
  let view = s.view;
  if (s.bu === "GROUP") {

  document.getElementById("rail").innerHTML =

  const out = s.register === "report"
    ? renderReportView(Object.assign({}, s, { view }))
    : ANALYSE_RENDERERS[view](Object.assign({}, s, { view }));
  const content = document.getElementById("content");
  content.className = s.register === "report" ? "register-report" : "register-analyse";
  content.innerHTML = `<div class="page-head"><h1>${esc(out.title)}</h1>

  wireExports(content);

    banner.hidden = DATA_SOURCE !== "snapshot" && !CONFIDENTIAL;
    banner.innerHTML = (CONFIDENTIAL ? `<b>CONFIDENTIAL BUILD</b> — contains customer contact detail; internal circulation only. ` : "") +
      (DATA_SOURCE === "snapshot" ? `Offline snapshot dated <b>${pd(SNAPSHOT)}</b> — figures are frozen at that date; open with a connection for live engine reads.` : "");
  }
  document.getElementById("statusbar").innerHTML =
    `<span>source: ${DATA_SOURCE}${DATA_SOURCE === "snapshot" ? " " + SNAPSHOT : ""} · monthly grain</span><span class="grow"></span>
     <span>attribution: ${s.attribution}</span><span>${CONFIDENTIAL ? "CONFIDENTIAL — internal only" : "PII-free build"}</span>`;
}

/* ---------------- wiring ---------------- */
document.addEventListener("click", ev => {
  const rg = ev.target.closest("[data-register]");
  if (rg) { setState({ register: rg.dataset.register, view: "" }); return; }
  const bu = ev.target.closest("[data-bu]");
  if (bu) { setState({ bu: bu.dataset.bu }); return; }
  const v = ev.target.closest("[data-view]");
  if (v) { ev.preventDefault(); setState({ view: v.dataset.view }); return; }
});
document.getElementById("ctl-period").addEventListener("change", e => {
  const period = e.target.value;
  if (period === "custom") {
    document.getElementById("custom-range").hidden = false;
    setState({ period, from: readState().from, to: readState().to });
  } else setState({ period });
});
document.getElementById("ctl-from").addEventListener("change", e => setState({ period: "custom", from: e.target.value }));
document.getElementById("ctl-to").addEventListener("change", e => setState({ period: "custom", to: e.target.value }));
document.getElementById("ctl-compare").addEventListener("change", e => setState({ compare: e.target.value }));
document.getElementById("ctl-attr").addEventListener("change", e => setState({ attribution: e.target.value }));

/* ---------------- boot ---------------- */
initData().then(src => {
  const conn = document.getElementById("conn");
  conn.title = "Data source: " + src;
  if (src === "snapshot") conn.classList.add("snap");
  render();
}).catch(err => {
  document.getElementById("conn").classList.add("err");
  document.getElementById("loading").textContent = "No data source available: " + err.message;
});

;
/* M2M Intelligence — REPORT register.
   The narrative surface: numbered chapters (a deliberate sequence — the story is
   ordered), verdict-first, honesty rules inherited from the deck. All figures come
   from the shared data adapter; the old deck's renderers were content donors only. */
"use strict";

const CHAPTERS = [
  ["home", "01 · What happened"],
  ["compare", "02 · How the BUs compare"],
  ["demand", "03 · What generated demand"],
  ["funnel", "04 · What happened to the leads"],
  ["working", "05 · What's working best"],
  ["ads", "06 · The Google Ads investment"],
  ["quality", "07 · Data quality & tracking"],
  ["actions", "08 · What we do next"],
];

/* ---------- simplified dial ---------- */
function dialSVG(ix, cur) {
  if (ix.score == null) {
    return `<div class="dial-wrap"><div class="dial-none">No score — ${esc(ix.reason)}</div></div>`;
  }
  const col = ix.band === "on-track" ? "var(--good)" : ix.band === "watch" ? "var(--warn)" : "var(--alert)";
  const pct = ix.score / 100;
  const r = 54, c = Math.PI * r; // half-circle
  const compLabel = { demand: "Demand", "demand-note": "Demand", quality: "Quality", cost: "Cost", follow: "Follow-up", outcome: "Outcome" };
  const chips = Object.entries(ix.comps).map(([k, v]) =>
    `<span class="dcomp"><b>${compLabel[k]}</b> ${v}</span>`).join("");
  const excl = ix.excluded.map(([k, why]) => `<div class="dexcl">· ${compLabel[k] || k} excluded — ${esc(why)}</div>`).join("");
  return `<div class="dial-wrap">
    <svg viewBox="0 0 140 84" class="dial" role="img" aria-label="Pipeline performance index ${ix.score}">
      <path d="M 16 74 A 54 54 0 0 1 124 74" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
      <path d="M 16 74 A 54 54 0 0 1 124 74" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${(pct * c).toFixed(1)} ${c.toFixed(1)}"/>
      <text x="70" y="62" text-anchor="middle" style="font-size:26px;font-weight:700;fill:var(--ink)">${ix.score}</text>
      <text x="70" y="78" text-anchor="middle" style="font-size:9px;fill:${col};font-weight:700;text-transform:uppercase;letter-spacing:.06em">${ix.band}</text>
    </svg>
    <div class="dial-side">
      <div class="dcomps">${chips}</div>
      <div class="dexcl">· Attribution coverage ${fmtP(ix.gclidCov, 0)} — context, never scored</div>
      ${excl}
    </div></div>`;
}

/* ---------- chapters ---------- */
function chHome(s) {
  const A = agg(s.bu, s.from, s.to, s.attribution);
  const [pf, pt] = prevRangeOf(s.from, s.to, "previous-period");
  const P = agg(s.bu, pf, pt, s.attribution);
  const ix = computeIndex(s.bu, s.from, s.to, s.attribution);
  const dLeads = P.leads ? Math.round((A.leads - P.leads) / P.leads * 100) : null;
  const verdict =
    `${A.cfg.label} generated <b>${fmtI(A.leads)} marketing leads</b> in this window` +
    (dLeads != null ? ` (${dLeads >= 0 ? "+" : ""}${dLeads}% vs the prior period)` : "") +
    `, of which <b>${fmtI(A.mql)} (${fmtP(A.mqlRate, 0)}) are MQLs</b> under the interim website-origin definition, ` +
    `for <b>${A.cfg.cur}${fmtI(A.spend)}</b> of ad spend` +
    (A.cpl ? ` — <b>${A.cfg.cur}${Math.round(A.cpl)} per lead</b> (${s.attribution === "gclid-floor" ? "GCLID floor" : "modelled blend"})` : "") + ".";
  let h = `<div class="verdict">${verdict}</div>`;
  h += dialSVG(ix, A);
  const ov = vOverview(s); // reuse the Analyse KPI strip + chart under the narrative lead
  h += ov.html;
  return { title: "What happened", sub: "The verdict first — then every number that supports it.", html: h };
}

function chDemand(s) {
  const A = agg(s.bu, s.from, s.to, s.attribution);
  const lanes = [
    ["paid_search", "Paid search", "GCLID-tracked ad clicks — a floor"],
    ["web_form", "Website forms", "organic + direct + untracked paid (mixed attribution)"],
    ["referral", "Referrals & partners", "named referrers"],
    ["inbound_contact", "Calls & inbound email", "phone + mailbox enquiries"],
    ["event", "Events", "trade shows & exhibitions"],
  ];
  const counts = lanes.map(([k]) => A.L.filter(r => r.channel === k).reduce((a, r) => a + r.leads, 0));
  const mx = Math.max(1, ...counts);
  let h = `<div class="panel"><div class="panel-head"><h2>Demand lanes — where the leads actually came from</h2></div><div class="panel-body">`;
  lanes.forEach(([k, l, sub], i) => {
    h += `<div class="lane-row"><div class="lane-l">${l}<small>${sub}</small></div>
      <div class="lane-t"><div class="lane-f" style="width:${Math.max(2, counts[i] / mx * 100)}%"></div></div>
      <div class="lane-n">${fmtI(counts[i])}</div></div>`;
  });
  const inR = monthsIn(s.from, s.to);
  const em = DB.rpt_email_monthly.filter(r => r.bu_code === s.bu && inR(r));
  const sent = em.reduce((a, r) => a + r.sent, 0), clicks = em.reduce((a, r) => a + r.clicks, 0);
  h += `</div></div><div class="callout">${sent
    ? `Email ran alongside: <b>${fmtI(sent)} sends, ${fmtI(clicks)} clicks</b> across this period's calendar months — an influence signal on the existing database, never counted as leads.`
    : `No email campaigns in this period for this BU.`}</div>`;
  const web = vWebsite(s);
  h += web.html;
  return { title: "What generated the demand", sub: "Five lanes plus email influence — Google Ads is one input, not the story.", html: h };
}

function chWorking(s) {
  const inR = monthsIn(s.from, s.to);
  const S = DB.rpt_spend_monthly.filter(r => r.bu_code === s.bu && inR(r));
  const byCamp = {};
  S.forEach(r => { const b = byCamp[r.campaign_name] = byCamp[r.campaign_name] || { sp: 0, cl: 0 }; b.sp += +r.spend; b.cl += r.clicks; });
  const camps = Object.entries(byCamp).map(([n, v]) => ({ n, ...v })).sort((a, b) => b.sp - a.sp);
  const A = agg(s.bu, s.from, s.to, s.attribution);
  const [pf, pt] = prevRangeOf(s.from, s.to, "previous-period");
  const P = agg(s.bu, pf, pt, s.attribution);
  const srcCur = {}, srcPrev = {};
  A.L.forEach(r => srcCur[r.channel] = (srcCur[r.channel] || 0) + r.leads);
  P.L.forEach(r => srcPrev[r.channel] = (srcPrev[r.channel] || 0) + r.leads);
  const movers = Object.keys(srcCur).map(k => ({ k, a: srcPrev[k] || 0, b: srcCur[k] }))
    .sort((x, y) => (y.b - y.a) - (x.b - x.a));
  let h = `<div class="panel"><div class="panel-head"><h2>Paid campaigns by spend</h2></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Campaign</th><th class="num">Spend</th><th class="num">Clicks</th><th class="num">CPC</th></tr></thead><tbody>`;
  camps.forEach(c => {
    h += `<tr><td>${esc(c.n)}</td><td class="num">${fmtM(c.sp, A.cfg.cur)}</td><td class="num">${fmtI(c.cl)}</td><td class="num">${c.cl ? A.cfg.cur + (c.sp / c.cl).toFixed(2) : "—"}</td></tr>`;
  });
  h += `</tbody></table></div><div class="panel-body"><span class="sub">Per-campaign lead counts land with the row-grain sync — until then campaign efficiency is spend-side only, and no per-campaign CPL is printed.</span></div></div>`;
  h += `<div class="panel"><div class="panel-head"><h2>Channel movers — this period vs prior</h2></div><div class="panel-body">`;
  movers.forEach(m => {
    const up = m.b > m.a, fl = m.b === m.a;
    h += `<div class="mover"><span>${esc(m.k)}</span><b style="color:${fl ? "var(--faint)" : up ? "var(--good)" : "var(--alert)"}">${m.a} → ${m.b}</b></div>`;
  });
  h += `</div></div>`;
  return { title: "What's working best", sub: "Ranked spend, and which channels are rising or falling.", html: h };
}

function chAds(s) {
  const A = agg(s.bu, s.from, s.to, s.attribution);
  const ms = monthlySeries(s.bu, s.from, s.to, s.attribution);
  let h = `<div class="kpis">
    ${kpi("Ad spend", fmtM(A.spend, A.cfg.cur), "", null, CHIP.hi)}
    ${kpi("Tracked paid leads (floor)", fmtI(A.paid), "", "GCLID-tagged only — " + fmtP(A.gclidCov, 0) + " of all leads carry the tag", CHIP.lo)}
    ${kpi("CPL — lead creation", A.leads ? fmtM(A.spend / A.leads, A.cfg.cur) : "—", "", "spend ÷ all marketing leads · modelled blend", CHIP.mod)}
    ${kpi("CPL — GCLID floor", A.paid ? fmtM(A.spend / A.paid, A.cfg.cur) : "—", "", "spend ÷ tracked paid only · overstates where tracking is broken", CHIP.lo)}
    ${kpi("Platform conv.*", fmtI(A.conv), "", "*bid signal — never counted as leads", CHIP.na)}
  </div>`;
  h += `<div class="panel"><div class="panel-head"><h2>Spend by month</h2></div><div class="panel-body">${barChart(ms.map(r => ({ m: r.m, v: Math.round(r.spend) })), { label: "spend" })}</div></div>`;
  const reds = DB.rpt_campaigns.filter(c => c.bu_code === s.bu && c.audit_health === "red" && c.status === "active");
  if (reds.length) h += `<div class="callout warn"><b>Audit flags:</b> ${esc(reds.map(c => c.campaign_name).join(", "))} carry red audit health (budget caps / bidding / structure — see registry).</div>`;
  h += `<div class="callout">Both CPL models are shown deliberately: the truth lies between the modelled blend (assumes all leads share the spend) and the GCLID floor (counts only what tracking can prove). The gap between them is the size of the attribution problem${s.bu === "M2M_AU" ? " — for AU it is the headline finding until the form fix ships" : ""}.</div>`;
  return { title: "The Google Ads investment", sub: "The paid chapter — spend, both honest CPL models, and the audit flags.", html: h };
}

function chActions(s) {
  const RECS = {
    "Immediate — this fortnight": [
      ["GCLID work order (SQiBLE, due 25 Jul)", "unlocks true paid attribution on ~78% of M2M One AU lead flow — overdue check-in if not shipped"],
      ["MMC CRM process agreement", "stages worked + deals linked — unlocks the MMC funnel past Lead"],
      ["Registry intent fields (marketing, 1 Aug)", "audience / offer / sales play on every campaign card"],
      ["Definitions workshop", "ratify the interim MQL rule + create a durable CRM flag"]],
    "Near-term — this quarter": [
      ["Enter n8n credentials", "turns this product's backfill snapshot into a live 30-minute feed, row-grain leads + daily spend"],
      ["Connect Google Search Console", "stakeholder ask #14 — lights the organic panel"],
      ["Email list hygiene", "bounce 7.6–13.8% across three accounts; split NZ operational vs marketing sends"],
      ["Landing-page optimisation loop", "pair top spenders with their landing conversion"]],
    "Capability — this half": [
      ["Finance joins (Phase 4)", "Jasper/Xero (AU) · MYOB (MMC) · Xero NZ — revenue and true ROI per BU; re-enables the dial's outcome component"],
      ["Pipeline sync", "deals/quotes linked to origin leads — funnel stages 7–8 light up"],
      ["Lead scoring & forecasting", "after two clean quarters of stage data"]],
  };
  let h = `<div class="recs-grid">`;
  for (const [hz, items] of Object.entries(RECS)) {
    h += `<div class="panel"><div class="panel-head"><h2>${hz}</h2></div><div class="panel-body">`;
    items.forEach(([t, d]) => { h += `<div class="rec"><b>${esc(t)}</b><small>${esc(d)}</small></div>`; });
    h += `</div></div>`;
  }
  h += `</div>`;
  return { title: "What we do next", sub: "Three horizons — every item evidence-based, owned and sequenced.", html: h };
}

/* chapter dispatch — compare / funnel / quality reuse the Analyse renderers wholesale */
const REPORT_RENDERERS = {
  home: chHome,
  compare: s => { const o = vCompare(s); o.sub = "The centrepiece — efficiency indexed to the group's best, never raw volumes."; return o; },
  demand: chDemand,
  funnel: vFunnel,
  working: chWorking,
  ads: chAds,
  quality: vQuality,
  actions: chActions,
};
function renderReportView(s) {
  const view = REPORT_RENDERERS[s.view] ? s.view : "home";
  return REPORT_RENDERERS[view](Object.assign({}, s, { view }));
}

</script>
