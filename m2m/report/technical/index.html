<title>M2M One &mdash; Lead Performance Diagnostic</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#003640;--ink2:#0a4a55;--teal:#00AFAA;--teald:#008985;--g3:#98989a;--g4:#666;--rule:#e0e5e6;--red:#AD0000}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:'Open Sans',system-ui,-apple-system,sans-serif;color:var(--ink);
background:#fff;background-image:radial-gradient(#e6e7ea 1px,transparent 1px);background-size:24px 24px;padding:24px}
.card{width:100%;max-width:412px;border:1px solid var(--rule);border-radius:6px;padding:40px 38px;background:#fff;
box-shadow:0 1px 3px rgba(0,54,64,.06)}
.logo{width:172px;margin-bottom:26px}.logo svg{width:100%;height:auto;display:block}
.eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--teald)}
h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:9px 0 0;line-height:1.25}
p.sub{font-size:14px;color:var(--g4);font-weight:300;margin:11px 0 26px;line-height:1.55}
label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--g3);display:block;margin-bottom:7px}
input{width:100%;padding:12px 13px;font-size:15px;font-family:inherit;border:1px solid var(--rule);border-radius:4px;
color:var(--ink);outline:none;transition:border-color .15s}
input:focus{border-color:var(--teal)}
button{width:100%;margin-top:14px;padding:12px;font-size:14px;font-weight:700;font-family:inherit;
background:var(--ink);color:#fff;border:0;border-radius:4px;cursor:pointer;letter-spacing:.02em;transition:background .15s}
button:hover{background:var(--ink2)}button:disabled{opacity:.6;cursor:default}
.err{color:var(--red);font-size:13px;margin-top:13px;min-height:19px;font-weight:600}
.foot{margin-top:26px;padding-top:17px;border-top:1px solid var(--rule);font-size:11px;color:var(--g3);line-height:1.6}
</style></head><body>

<script>
const B=JSON.parse(document.getElementById('d').textContent);
const b2a=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const btn=document.getElementById('b'),err=document.getElementById('e');
  btn.disabled=true;btn.textContent='Decrypting\u2026';err.textContent='';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('p').value),
      {name:'PBKDF2'},false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b2a(B.s),iterations:B.n,hash:'SHA-256'},km,
      {name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(B.i)},key,b2a(B.c));
    const html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(_){
    err.textContent='Incorrect password.';
    btn.disabled=false;btn.textContent='Unlock report';
    document.getElementById('p').value='';document.getElementById('p').focus();
  }
});
