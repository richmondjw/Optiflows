  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

items:center; font-family:'JetBrains Mono', monospace; font-size:7px; letter-spacing:0.1em; background:#111110; padding:5px 0;\"><span>TRACK CODE: 09-C3<\u002Fspan><span>↗<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:300px; height:190px; flex:0 0 300px; background:#FFFFFF; color:#0A0A0A; overflow:hidden; display:grid; grid-template-rows:auto 1fr auto;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:6.5px; letter-spacing:0.12em; padding:7px 9px; border-bottom:1px solid #0A0A0A;\">UNIT 04 &nbsp;/&nbsp; FIELD TESTED &nbsp;/&nbsp; MADE IN U.S.A.<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; justify-content:center; gap:14px;\"><div style=\"width:44px; height:44px; background:conic-gradient(#0A0A0A 0 12deg,transparent 12deg 30deg,#0A0A0A 30deg 42deg,transparent 42deg 60deg,#0A0A0A 60deg 72deg,transparent 72deg 90deg,#0A0A0A 90deg 102deg,transparent 102deg 120deg,#0A0A0A 120deg 132deg,transparent 132deg 150deg,#0A0A0A 150deg 162deg,transparent 162deg 180deg,#0A0A0A 180deg 192deg,transparent 192deg 210deg,#0A0A0A 210deg 222deg,transparent 222deg 240deg,#0A0A0A 240deg 252deg,transparent 252deg 270deg,#0A0A0A 270deg 282deg,transparent 282deg 300deg,#0A0A0A 300deg 312deg,transparent 312deg 330deg,#0A0A0A 330deg 342deg,transparent 342deg 360deg); border-radius:50%;\"><\u002Fdiv><div style=\"font-size:15px; font-weight:700; letter-spacing:-0.02em; line-height:1.1;\">S-Max<br><span style=\"font-family:'JetBrains Mono', monospace; font-size:7px; font-weight:400; letter-spacing:0.1em; color:#5A5A54;\">MOTION GRID / 7<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"height:16px; background:repeating-linear-gradient(90deg,#0A0A0A 0 2px,#fff 2px 4px);\"><\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:30px 34px;\"><div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Type<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Tight neo-grotesk, likely Helvetica Now or Neue Haas Grotesk Display. Two registers only: 700 display at −3% tracking, and 400 mono at 8–9px for the label furniture. Sentence case for headlines, uppercase for every label. <span style=\"color:#7C7C73; font-family:'JetBrains Mono', monospace; font-size:10px;\">Sub: Archivo 700 / JetBrains Mono 400<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Shape &amp; line<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Radius 0 throughout. 1px hairlines subdividing the tile into 3–5 unequal panels. Borders define regions, never decorate. 8-col grid on a 16:9 tile, gutters equal to the type size.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Texture &amp; material<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Horizontal rule-stripes at 3–5px pitch used as a tonal fill. Halftone starburst / asterisk bloom. Barcode blocks. Everything is printed ink, no gradients, no shadow.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Layout archetypes<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Four-up quadrant board where each tile is a poster. Headline top-left, giant rotated numeral bleeding off the right edge, spec stack bottom-left, warning bar across the base.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Marks<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">® after the wordmark. Asterisk/starburst glyph. Corner arrow ↗. Barcodes. Crop marks at tile corners.<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<section id=\"s02\" data-screen-label=\"02 Robotics Program\" style=\"border-top:1px solid #23231F; padding:52px 0 58px; scroll-margin-top:74px;\">\n    <div style=\"width:100%; max-width:1180px; margin:0 auto; padding:0 32px; display:flex; flex-direction:column; gap:36px;\">\n      <div style=\"display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:44px; align-items:start;\">\n        <div style=\"display:flex; flex-direction:column; gap:16px;\"><div style=\"display:flex; align-items:flex-end; gap:12px;\"><span style=\"font-family:'JetBrains Mono', monospace; font-size:11px; color:#6F6F68;\">02<\u002Fspan><span style=\"font-size:27px; font-weight:700; letter-spacing:-0.02em;\">Robotics Program<\u002Fspan><span style=\"font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.14em; padding:3px 7px; border:1px solid #4A4A42; color:#B9B9AE;\">CORE<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:14px; line-height:1.55; color:#C9C9C0; text-wrap:pretty;\">The same industrial grid softened by a mid-century sage-teal and pinstripe fills — closer to a 1960s annual report than a warning sign.<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:6px;\"><div style=\"height:52px; background:#8FB3AC;\"><\u002Fdiv><div style=\"height:52px; background:#B9CFC9;\"><\u002Fdiv><div style=\"height:52px; background:#F2F2EE;\"><\u002Fdiv><div style=\"height:52px; background:#1E2A28;\"><\u002Fdiv><div style=\"height:52px; background:#5E7C76;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:6px; font-family:'JetBrains Mono', monospace; font-size:9px; color:#7C7C73;\"><span>#8FB3AC<\u002Fspan><span>#B9CFC9<\u002Fspan><span>#F2F2EE<\u002Fspan><span>#1E2A28<\u002Fspan><span>#5E7C76<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono', monospace; font-size:10px; line-height:1.7; color:#7C7C73;\">Evidence: Robotics Program R-100 / Adaptive Manufacturing / IRP / R9<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:9px; border-left:1px solid #26261F; padding-left:26px;\">\n          <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#E0B44A;\">Critique<\u002Fdiv>\n          <div style=\"font-size:13.5px; line-height:1.62; color:#C9C9C0; text-wrap:pretty; display:flex; flex-direction:column; gap:10px;\">Structurally indistinguishable from 01 and 03 — same grid, same numerals, same chips. It earns its place only through palette and stripe pitch. Keep one skeleton, three colourways; don't pretend they're three systems.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:12px;\"><div style=\"width:300px; height:190px; flex:0 0 300px; background:#F2F2EE; color:#1E2A28; overflow:hidden; display:grid; grid-template-columns:1fr 120px;\">\n        <div style=\"padding:11px 10px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid #1E2A28;\">\n          <div style=\"font-family:'JetBrains Mono', monospace; font-size:6px; line-height:1.7; letter-spacing:0.08em; color:#5E7C76;\">SUPERIOR MANUFACTURING<br>CONTINUOUS PACKAGING<\u002Fdiv>\n          <div style=\"font-size:21px; font-weight:600; letter-spacing:-0.025em; line-height:1.02;\">Robotics<br>Program <span style=\"font-size:10px; vertical-align:super;\">®<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; gap:5px; align-items:center; font-family:'JetBrains Mono', monospace; font-size:6.5px;\"><span style=\"border:1px solid #1E2A28; padding:2px 4px;\">MADE IN USA<\u002Fspan><span style=\"font-weight:700; font-size:11px;\">R-100<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#8FB3AC; position:relative; overflow:hidden;\"><div style=\"position:absolute; inset:0; background:repeating-linear-gradient(90deg,#F2F2EE 0 2px,transparent 2px 5px); opacity:0.55;\"><\u002Fdiv><div style=\"position:absolute; right:-8px; bottom:-30px; font-size:110px; font-weight:300; color:#F2F2EE; line-height:1;\">5<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:300px; height:190px; flex:0 0 300px; background:#8FB3AC; color:#12201D; overflow:hidden; padding:11px 12px; display:flex; flex-direction:column; justify-content:space-between; position:relative;\">\n        <div style=\"position:absolute; right:10px; top:44px; width:150px; height:60px; background:radial-gradient(#F2F2EE 1px, transparent 1.4px) 0 0/9px 9px; opacity:0.85;\"><\u002Fdiv>\n        <div style=\"display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:6px; letter-spacing:0.1em;\"><span style=\"border:1px solid #12201D; padding:2px 5px; font-weight:700;\">R9<\u002Fspan><span>MULTI-ROBOT COORDINATION TEST<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:23px; font-weight:600; letter-spacing:-0.03em; line-height:1.05; position:relative;\">Adaptive<br>Manufacturing<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:6px; letter-spacing:0.08em; border-top:1px solid #12201D; padding-top:5px;\">POWER DOWN ENABLED BY AUTHORIZED STAFF &nbsp;/&nbsp; CORE PRODUCTION SECTOR<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:300px; height:190px; flex:0 0 300px; background:#E7EDEA; color:#1E2A28; overflow:hidden; position:relative; display:flex; flex-direction:column; justify-content:flex-end; padding:11px;\">\n        <div style=\"position:absolute; inset:0; background:repeating-linear-gradient(180deg,#B9CFC9 0 4px,transparent 4px 11px);\"><\u002Fdiv>\n        <div style=\"position:relative; font-size:26px; font-weight:700; letter-spacing:-0.045em; background:#E7EDEA; display:inline-block; padding:2px 4px; align-self:flex-start;\">HIGH OUTPUT<\u002Fdiv>\n        <div style=\"position:relative; display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-family:'JetBrains Mono', monospace; font-size:6.5px; letter-spacing:0.1em; background:#E7EDEA; padding:4px;\"><span>TRACK CODE: 09-C3<\u002Fspan><span>↗<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:30px 34px;\"><div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Type<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Identical grotesk to 01, one step lighter (600 not 800). Headline set in two words on two lines, sentence case. Numerals become the artwork: a single figure at 5–8× body size, 300 weight, ghosted back into the field. <span style=\"color:#7C7C73; font-family:'JetBrains Mono', monospace; font-size:10px;\">Sub: Archivo 600 / 300<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Shape &amp; line<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Radius 0. Thin 0.75px keylines, lighter than 01. Tiles subdivide into a 2×2 or 1+2 panel set. White inset margins around coloured panels — the frame is part of the composition.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Texture &amp; material<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Fine vertical pinstripes at 2–4px pitch. Dot-grid confetti fields. Half-tone circular cutouts. Textures sit behind type at 40–60% contrast, never over it.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Layout archetypes<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Four-up quadrant board, same as 01. Title block occupies the left third; texture field the right two-thirds; a chip row of metadata pinned to the bottom edge.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Marks<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">® lockup. MADE IN USA chip. Boxed model codes (R-100, R9). Stacked-bar glyph as a list icon.<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<section id=\"s03\" data-screen-label=\"03 High Output Marigold\" style=\"border-top:1px solid #23231F; padding:52px 0 58px; scroll-margin-top:74px;\">\n    <div style=\"width:100%; max-width:1180px; margin:0 auto; padding:0 32px; display:flex; flex-direction:column; gap:36px;\">\n      <div style=\"display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:44px; align-items:start;\">\n        <div style=\"display:flex; flex-direction:column; gap:16px;\"><div style=\"display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap;\"><span style=\"font-family:'JetBrains Mono', monospace; font-size:11px; color:#6F6F68;\">03<\u002Fspan><span style=\"font-size:27px; font-weight:700; letter-spacing:-0.02em;\">High Output (Marigold)<\u002Fspan><span style=\"font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.14em; padding:3px 7px; border:1px solid #6B5A1E; background:#221C08; color:#E0B44A;\">VARIANT<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:14px; line-height:1.55; color:#C9C9C0; text-wrap:pretty;\">Row 02's skeleton in marigold and black. Warmer, louder, more consumer-facing; the pinstripes read as energy rather than engineering.<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:6px;\"><div style=\"height:52px; background:#F5A11E;\"><\u002Fdiv><div style=\"height:52px; background:#FFC65C;\"><\u002Fdiv><div style=\"height:52px; background:#FFFFFF;\"><\u002Fdiv><div style=\"height:52px; background:#111111;\"><\u002Fdiv><div style=\"height:52px; background:#D8D8D2;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:6px; font-family:'JetBrains Mono', monospace; font-size:9px; color:#7C7C73;\"><span>#F5A11E<\u002Fspan><span>#FFC65C<\u002Fspan><span>#FFFFFF<\u002Fspan><span>#111111<\u002Fspan><span>#D8D8D2<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono', monospace; font-size:10px; line-height:1.7; color:#7C7C73;\">Evidence: the marigold quadrant board — identical copy to 02<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:9px; border-left:1px solid #26261F; padding-left:26px;\">\n          <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#E0B44A;\">Critique<\u002Fdiv>\n          <div style=\"font-size:13.5px; line-height:1.62; color:#C9C9C0; text-wrap:pretty; display:flex; flex-direction:column; gap:10px;\"><div>Not a system. This is 02 with the hue rotated, down to the same headline words in the same slots. Catalogue it as <span style=\"color:#E9E9E2;\">Robotics Program / Marigold<\u002Fspan> and delete the pretence.<\u002Fdiv><div style=\"font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.1em; color:#E0B44A; border-top:1px solid #3A3222; padding-top:8px;\">MERGE → 02<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:12px;\"><div style=\"width:300px; height:190px; flex:0 0 300px; background:#FFFFFF; color:#111; overflow:hidden; display:grid; grid-template-columns:1fr 120px;\">\n        <div style=\"padding:11px 10px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid #111;\">\n          <div style=\"font-family:'JetBrains Mono', monospace; font-size:6px; line-height:1.7; letter-spacing:0.08em; color:#7A6A3A;\">SUPERIOR MANUFACTURING<br>CONTINUOUS PACKAGING<\u002Fdiv>\n          <div style=\"font-size:21px; font-weight:600; letter-spacing:-0.025em; line-height:1.02;\">Robotics<br>Program <span style=\"font-size:10px; vertical-align:super;\">®<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; gap:5px; align-items:center; font-family:'JetBrains Mono', monospace; font-size:6.5px;\"><span style=\"border:1px solid #111; padding:2px 4px;\">MADE IN USA<\u002Fspan><span style=\"font-weight:700; font-size:11px;\">R-100<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#F5A11E; position:relative; overflow:hidden;\"><div style=\"position:absolute; inset:0; background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 5px); opacity:0.5;\"><\u002Fdiv><div style=\"position:absolute; right:-8px; bottom:-30px; font-size:110px; font-weight:300; color:#fff; line-height:1;\">5<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:300px; height:190px; flex:0 0 300px; background:#F5A11E; color:#111; overflow:hidden; padding:11px 12px; display:flex; flex-direction:column; justify-content:space-between; position:relative;\">\n        <div style=\"position:absolute; right:10px; top:44px; width:150px; height:60px; background:radial-gradient(#fff 1px, transparent 1.4px) 0 0/9px 9px;\"><\u002Fdiv>\n        <div style=\"display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:6px; letter-spacing:0.1em;\"><span style=\"border:1px solid #111; padding:2px 5px; font-weight:700;\">R9<\u002Fspan><span>MULTI-ROBOT COORDINATION TEST<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:23px; font-weight:600; letter-spacing:-0.03em; line-height:1.05; position:relative;\">Adaptive<br>Manufacturing<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:6px; letter-spacing:0.08em; border-top:1px solid #111; padding-top:5px;\">POWER DOWN ENABLED BY AUTHORIZED STAFF<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:300px; height:190px; flex:0 0 300px; background:#FFFFFF; color:#111; overflow:hidden; position:relative; display:flex; flex-direction:column; justify-content:flex-end; padding:11px;\">\n        <div style=\"position:absolute; inset:0; background:repeating-linear-gradient(180deg,#F5A11E 0 5px,transparent 5px 11px);\"><\u002Fdiv>\n        <div style=\"position:relative; font-size:26px; font-weight:800; letter-spacing:-0.05em; background:#fff; align-self:flex-start; padding:2px 4px;\">HIGH OUTPUT<\u002Fdiv>\n        <div style=\"position:relative; display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-family:'JetBrains Mono', monospace; font-size:6.5px; letter-spacing:0.1em; background:#fff; padding:4px;\"><span>TRACK CODE: 09-C3<\u002Fspan><span>↗<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:30px 34px;\"><div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Type<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Unchanged from 02. The only typographic difference is contrast: black on marigold pushes the display weight to look heavier than it is, so drop one weight step to compensate.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Shape &amp; line<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Unchanged from 02. Radius 0, 0.75px keylines, white inset frame.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Texture &amp; material<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Same stripe and dot vocabulary, higher amplitude. The confetti dot field goes white-on-marigold and becomes the dominant texture.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Layout archetypes<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Same four-up board, same slot assignments, same copy.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Marks<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Same set as 02.<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<section id=\"s04\" data-screen-label=\"04 American Industrial Revival\" style=\"border-top:1px solid #23231F; padding:52px 0 58px; scroll-margin-top:74px;\">\n    <div style=\"width:100%; max-width:1180px; margin:0 auto; padding:0 32px; display:flex; flex-direction:column; gap:36px;\">\n      <div style=\"display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:44px; align-items:start;\">\n        <div style=\"display:flex; flex-direction:column; gap:16px;\"><div style=\"display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap;\"><span style=\"font-family:'JetBrains Mono', monospace; font-size:11px; color:#6F6F68;\">04<\u002Fspan><span style=\"font-size:27px; font-weight:700; letter-spacing:-0.02em;\">American Industrial Revival<\u002Fspan><span style=\"font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.14em; padding:3px 7px; border:1px solid #4A4A42; color:#B9B9AE;\">CORE<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:14px; line-height:1.55; color:#C9C9C0; text-wrap:pretty;\">Safety orange, hairline CAD line-art and dense spec tables. The house style of the whole board: patriotic manufacturing dressed as a product datasheet.<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:6px;\"><div style=\"height:52px; background:#FF4A17;\"><\u002Fdiv><div style=\"height:52px; background:#FF7A45;\"><\u002Fdiv><div style=\"height:52px; background:#0E0E0E;\"><\u002Fdiv><div style=\"height:52px; background:#FFFFFF;\"><\u002Fdiv><div style=\"height:52px; background:#C9DDF0;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:6px; font-family:'JetBrains Mono', monospace; font-size:9px; color:#7C7C73;\"><span>#FF4A17<\u002Fspan><span>#FF7A45<\u002Fspan><span>#0E0E0E<\u002Fspan><span>#FFFFFF<\u002Fspan><span>#C9DDF0<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono', monospace; font-size:10px; line-height:1.7; color:#7C7C73;\">Evidence: An American Industrial Revival / ARC / Specs / V 1.2 / Automate the work that built America<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:9px; border-left:1px solid #26261F; padding-left:26px;\">\n          <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#E0B44A;\">Critique<\u002Fdiv>\n          <div style=\"font-size:13.5px; line-height:1.62; color:#C9C9C0; text-wrap:pretty; display:flex; flex-direction:column; gap:10px;\">The most complete and most derivative: safety orange plus technical mono is the default look of every defence-tech and hard-tech startup right now. It's executed better than most, but it will date fast. If you keep one, keep this — and find a second colour that isn't orange.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:12px;\"><div style=\"width:300px; height:190px; flex:0 0 300px; background:#FFFFFF; color:#0E0E0E; overflow:hidden; display:grid; grid-template-columns:16px 1fr;\">\n        <div style=\"background:#FF4A17; color:#fff; display:flex; align-items:center; justify-content:center;\"><span style=\"writing-mode:vertical-rl; font-family:'JetBrains Mono', monospace; font-size:6.5px; letter-spacing:0.16em;\">PRODUCT OVERVIEW<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column;\">\n          <div style=\"padding:9px 10px 7px; border-bottom:1px solid #0E0E0E;\"><div style=\"font-size:15px; font-weight:700; letter-spacing:-0.025em; line-height:1.05;\">An American <span style=\"font-size:8px; vertical-align:super;\">®<\u002Fspan><br>Industrial Revival<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1; display:grid; grid-template-columns:1fr 1fr;\">\n            <div style=\"border-right:1px solid #0E0E0E; padding:8px; display:flex; align-items:center; justify-content:center;\">\n              <div style=\"width:96px; height:64px; border:1px solid #0E0E0E; position:relative;\"><div style=\"position:absolute; left:8px; top:8px; width:34px; height:34px; border:1px solid #0E0E0E; transform:rotate(18deg);\"><\u002Fdiv><div style=\"position:absolute; right:10px; bottom:10px; width:44px; height:16px; border:1px solid #0E0E0E;\"><\u002Fdiv><div style=\"position:absolute; left:0; right:0; top:50%; border-top:1px dashed #9A9A94;\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:8px 9px; font-family:'JetBrains Mono', monospace; font-size:6px; line-height:1.85; letter-spacing:0.06em;\"><div style=\"display:flex; justify-content:space-between; border-bottom:1px solid #D2D2CC; padding-bottom:2px; margin-bottom:3px;\"><span>MOTION<\u002Fspan><span>CONTROL<\u002Fspan><\u002Fdiv>PAYLOAD &nbsp;&nbsp;&nbsp; 12.5 KG<br>REACH &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 1300 MM<br>REPEAT &nbsp;&nbsp;&nbsp;&nbsp; ±0.02 MM<br>AXES &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 6<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #0E0E0E; padding:5px 9px; font-family:'JetBrains Mono', monospace; font-size:6px; letter-spacing:0.1em; display:flex; justify-content:space-between;\"><span>SELF-DIAGNOSTIC PAYLOAD<\u002Fspan><span>↗<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:300px; height:190px; flex:0 0 300px; background:#FF4A17; color:#0E0E0E; overflow:hidden; padding:11px 12px; display:flex; flex-direction:column; justify-content:space-between;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:6px; letter-spacing:0.1em; display:flex; justify-content:space-between;\"><span>INTEGRATE INTELLIGENCE INTO INDUSTRY<\u002Fspan><span>U.S.A.<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:22px; font-weight:700; letter-spacing:-0.03em; line-height:1.08;\">Automate the work<br>that built America<\u002Fdiv>\n        <div style=\"display:flex; justify-content:space-between; align-items:flex-end;\"><div style=\"font-family:'JetBrains Mono', monospace; font-size:6px; line-height:1.7;\">FORGED ALLOY / POLYMER COMPOSITE<br>MULTI-SPECTRUM SENSOR SUITE<\u002Fdiv><div style=\"text-align:right;\"><div style=\"font-size:17px; font-weight:700; letter-spacing:-0.02em;\">V 1.2<\u002Fdiv><div style=\"width:15px; height:15px; border:1px solid #0E0E0E; border-radius:50%; margin-left:auto; margin-top:3px;\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:300px; height:190px; flex:0 0 300px; background:#141412; color:#F2F2F0; overflow:hidden; padding:11px 12px; display:flex; flex-direction:column; justify-content:space-between;\">\n        <div style=\"display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:6px; letter-spacing:0.12em; color:#FF7A45;\"><span>ARC ROBOTICS<\u002Fspan><span>SPECTER ONE<\u002Fspan><span>MADE IN U.S.A.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; align-items:flex-end; gap:9px;\"><div style=\"font-family:'Barlow Condensed', sans-serif; font-size:34px; font-weight:600; letter-spacing:0.02em; line-height:0.9;\">ARC ROBOT<\u002Fdiv><div style=\"font-family:'Barlow Condensed', sans-serif; font-size:34px; color:#4A4A44; line-height:0.9;\">S1<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px; font-family:'JetBrains Mono', monospace; font-size:5.6px; line-height:1.9; letter-spacing:0.06em; color:#C9C9C0; border-top:1px solid #3A3A34; padding-top:6px;\"><div>LUMEN &nbsp;&nbsp; 04-000-01<br>MASS &nbsp;&nbsp;&nbsp;&nbsp; 46.2 KG<br>RUN TIME &nbsp; 6.0 HRS<\u002Fdiv><div>SENSOR &nbsp;&nbsp; LIDAR / THERMAL<br>COMMS &nbsp;&nbsp;&nbsp; MESH 5.8 GHZ<br>RATING &nbsp;&nbsp; IP-67<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:30px 34px;\"><div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Type<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Two-typeface system: a tight grotesk for headlines (Söhne / Helvetica Now, 700, −2.5%) and a technical mono at 7–9px, uppercase, +10% tracking, for every label, column head and footnote. Headlines are sentence case and never exceed four words. <span style=\"color:#7C7C73; font-family:'JetBrains Mono', monospace; font-size:10px;\">Sub: Archivo 700 / JetBrains Mono 400<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Shape &amp; line<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Radius 0. 0.5–1px rules everywhere, forming a visible table. Left-edge vertical label strip is a signature. Content sits in a 12-col grid with a persistent 6–8px margin frame.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Texture &amp; material<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">No texture — the CAD linework is the texture. Exploded isometric robot arms, dimension leaders, section hatching at 45°. Ink on paper stock, occasionally reversed to orange knockout.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Layout archetypes<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">The spec sheet: title bar, 60/40 split of drawing to table, two-column spec stack, footer rule with part number. Also a full-bleed orange statement slide with one sentence set large.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Marks<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Circled ® and ⊕ registration targets. ↗ arrows. Corner brackets [ ]. Version chips (V 1.2). Small triangle-in-circle warning glyph.<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<section id=\"s05\" data-screen-label=\"05 S1 Blueprint\" style=\"border-top:1px solid #23231F; padding:52px 0 58px; scroll-margin-top:74px;\">\n    <div style=\"width:100%; max-width:1180px; margin:0 auto; padding:0 32px; display:flex; flex-direction:column; gap:36px;\">\n      <div style=\"display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:44px; align-items:start;\">\n        <div style=\"display:flex; flex-direction:column; gap:16px;\"><div style=\"display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap;\"><span style=\"font-family:'JetBrains Mono', monospace; font-size:11px; color:#6F6F68;\">05<\u002Fspan><span style=\"font-size:27px; font-weight:700; letter-spacing:-0.02em;\">S1 Spec Sheet<\u002Fspan><span style=\"font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.14em; padding:3px 7px; border:1px solid #4A4A42; color:#B9B9AE;\">CORE<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:14px; line-height:1.55; color:#C9C9C0; text-wrap:pretty;\">Cyanotype blueprint: pale blue field, white line drawings, everything dimensioned. The calmest system on the board and the only one that reads as documentation rather than marketing.<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:6px;\"><div style=\"height:52px; background:#CFE2F5;\"><\u002Fdiv><div style=\"height:52px; background:#8FB6E0;\"><\u002Fdiv><div style=\"height:52px; background:#1B4F9C;\"><\u002Fdiv><div style=\"height:52px; background:#FFFFFF;\"><\u002Fdiv><div style=\"height:52px; background:#0B0B0B;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:6px; font-family:'JetBrains Mono', monospace; font-size:9px; color:#7C7C73;\"><span>#CFE2F5<\u002Fspan><span>#8FB6E0<\u002Fspan><span>#1B4F9C<\u002Fspan><span>#FFFFFF<\u002Fspan><span>#0B0B0B<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono', monospace; font-size:10px; line-height:1.7; color:#7C7C73;\">Evidence: S1 Spec Sheet / Top View / Robotic Packaging / ARC-Division<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:9px; border-left:1px solid #26261F; padding-left:26px;\">\n          <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#E0B44A;\">Critique<\u002Fdiv>\n          <div style=\"font-size:13.5px; line-height:1.62; color:#C9C9C0; text-wrap:pretty; display:flex; flex-direction:column; gap:10px;\">The most defensible direction here, because it depends on craft (real linework) rather than on a colour. It's also the only one that can't be faked quickly — which is exactly why it's worth keeping. Weakness: it has no loud register, so it needs 04 or 09 alongside it for anything promotional.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:12px;\"><div style=\"width:300px; height:190px; flex:0 0 300px; background:#FFFFFF; color:#0B0B0B; overflow:hidden; display:flex; flex-direction:column;\">\n        <div style=\"padding:9px 10px 6px; display:flex; justify-content:space-between; align-items:flex-start;\"><div><div style=\"font-size:19px; font-weight:700; letter-spacing:-0.03em;\">S1 Spec Sheet<\u002Fdiv><div style=\"font-family:'JetBrains Mono', monospace; font-size:6px; letter-spacing:0.1em; color:#1B4F9C; margin-top:2px;\">TECHNICAL SPECIFICATIONS<\u002Fdiv><\u002Fdiv><div style=\"font-size:11px; font-weight:600; color:#1B4F9C;\">Top View<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1; background:#CFE2F5; margin:0 10px 10px; position:relative; overflow:hidden;\">\n          <div style=\"position:absolute; inset:0; background:radial-gradient(#8FB6E0 0.7px, transparent 1px) 0 0/11px 11px;\"><\u002Fdiv>\n          <div style=\"position:absolute; left:14%; top:22%; width:46%; height:52%; border:1.5px solid #fff;\"><\u002Fdiv>\n          <div style=\"position:absolute; left:52%; top:38%; width:34%; height:20%; border:1px solid #fff;\"><\u002Fdiv>\n          <div style=\"position:absolute; left:0; right:0; top:50%; border-top:1px dashed #fff;\"><\u002Fdiv>\n          <div style=\"position:absolute; left:14%; right:14%; bottom:8px; border-top:1px solid #1B4F9C;\"><\u002Fdiv>\n          <div style=\"position:absolute; left:50%; bottom:10px; transform:translateX(-50%); font-family:'JetBrains Mono', monospace; font-size:5.5px; color:#1B4F9C; background:#CFE2F5; padding:0 3px;\">1300 MM<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:300px; height:190px; flex:0 0 300px; background:#F7FAFE; color:#0B0B0B; overflow:hidden; display:grid; grid-template-columns:1fr 1fr; gap:1px; background-color:#0B0B0B;\">\n        <div style=\"background:#F7FAFE; padding:10px; display:flex; flex-direction:column; justify-content:space-between;\">\n          <div style=\"font-size:17px; font-weight:700; letter-spacing:-0.03em; line-height:1.05;\">Robotic<br>Packaging <span style=\"font-size:8px; vertical-align:super;\">®<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono', monospace; font-size:5.6px; line-height:1.9; letter-spacing:0.06em; color:#3A4A5C;\">PLUG AND PLAY<br>SELF-DIAGNOSTIC PAYLOAD<br>ADVANCED RESEARCH UNIT NYC<\u002Fdiv>\n          <div style=\"font-size:11px; font-weight:600; letter-spacing:-0.02em;\">An American<br>Industrial Revival<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#2A2E33; color:#CFE2F5; padding:10px; position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:center;\">\n          <div style=\"position:absolute; top:12px; right:10px; width:76px; height:34px; background:radial-gradient(#CFE2F5 1px, transparent 1.3px) 0 0/10px 10px; opacity:0.7;\"><\u002Fdiv>\n          <div style=\"font-size:17px; font-weight:600; letter-spacing:-0.02em; color:#5B9BE8; line-height:1.1;\">ARC -<br>Division<\u002Fdiv>\n          <div style=\"position:absolute; bottom:9px; left:10px; right:10px; height:22px; background:repeating-linear-gradient(45deg,#4A4E53 0 3px,transparent 3px 7px);\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:300px; height:190px; flex:0 0 300px; background:#CFE2F5; color:#1B4F9C; overflow:hidden; padding:10px; display:flex; flex-direction:column; justify-content:space-between; position:relative;\">\n        <div style=\"position:absolute; inset:0; background:repeating-linear-gradient(45deg,rgba(255,255,255,0.6) 0 1px,transparent 1px 8px);\"><\u002Fdiv>\n        <div style=\"position:relative; display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:5.6px; letter-spacing:0.12em;\"><span>SHEET 03 / REV A<\u002Fspan><span>SCALE 1:4<\u002Fspan><\u002Fdiv>\n        <div style=\"position:relative; display:flex; align-items:center; gap:12px;\"><div style=\"width:52px; height:52px; border:1.5px solid #fff; border-radius:50%; position:relative;\"><div style=\"position:absolute; left:50%; top:0; bottom:0; border-left:1px dashed #1B4F9C;\"><\u002Fdiv><div style=\"position:absolute; top:50%; left:0; right:0; border-top:1px dashed #1B4F9C;\"><\u002Fdiv><\u002Fdiv><div style=\"font-family:'JetBrains Mono', monospace; font-size:6px; line-height:2; letter-spacing:0.08em;\">DATUM &nbsp;A<br>TOLERANCE ±0.02<br>MATERIAL 6061-T6<\u002Fdiv><\u002Fdiv>\n        <div style=\"position:relative; border-top:1px solid #1B4F9C; padding-top:5px; font-family:'JetBrains Mono', monospace; font-size:5.6px; letter-spacing:0.1em; display:flex; justify-content:space-between;\"><span>ADVANCED RESEARCH UNIT NYC<\u002Fspan><span>P/N 08911<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:30px 34px;\"><div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Type<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Single grotesk, 500–700. Headline at 3× body, sentence case, no tracking games. Labels are 6–7px mono set in blue, not black — the whole sheet stays within one hue family. Numerals tabular.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Shape &amp; line<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Radius 0. Line weight hierarchy is the whole system: 1.5px object outline, 0.75px detail, 0.5px dimension, dashed centreline. Panel splits at 60/40 and 50/50 only.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Texture &amp; material<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">45° hatch fills. Dot-grid plotting field behind drawings. Optional paper tooth. No solid fills larger than a label chip.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Layout archetypes<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Title block top-left, drawing centred with breathing room, dimension callouts on two edges, revision table bottom-right. Poster pairs that share a drawing across two sheets.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Marks<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Circled A revision balloons, ⊕ datum targets, dimension arrows, section arrows, part-number chips.<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<section id=\"s06\" data-screen-label=\"06 B-2 Spirit Stealth\" style=\"border-top:1px solid #23231F; padding:52px 0 58px; scroll-margin-top:74px;\">\n    <div style=\"width:100%; max-width:1180px; margin:0 auto; padding:0 32px; display:flex; flex-direction:column; gap:36px;\">\n      <div style=\"display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:44px; align-items:start;\">\n        <div style=\"display:flex; flex-direction:column; gap:16px;\"><div style=\"display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap;\"><span style=\"font-family:'JetBrains Mono', monospace; font-size:11px; color:#6F6F68;\">06<\u002Fspan><span style=\"font-size:27px; font-weight:700; letter-spacing:-0.02em;\">B-2 / LO·STR<\u002Fspan><span style=\"font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.14em; padding:3px 7px; border:1px solid #4A4A42; color:#B9B9AE;\">CORE<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:14px; line-height:1.55; color:#C9C9C0; text-wrap:pretty;\">Declassified-document look: low-contrast greys, stencil headers, redaction bars and property-of markings. Information withheld as a design device.<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:6px;\"><div style=\"height:52px; background:#101214;\"><\u002Fdiv><div style=\"height:52px; background:#2A2E33;\"><\u002Fdiv><div style=\"height:52px; background:#4A4E53;\"><\u002Fdiv><div style=\"height:52px; background:#C9CDD2;\"><\u002Fdiv><div style=\"height:52px; background:#EDEFF2;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:6px; font-family:'JetBrains Mono', monospace; font-size:9px; color:#7C7C73;\"><span>#101214<\u002Fspan><span>#2A2E33<\u002Fspan><span>#4A4E53<\u002Fspan><span>#C9CDD2<\u002Fspan><span>#EDEFF2<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono', monospace; font-size:10px; line-height:1.7; color:#7C7C73;\">Evidence: B-2 SPIRIT / LO·STR / NATIONAL PROPERTY / HIGH SUBSONIC / American Automation Company<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:9px; border-left:1px solid #26261F; padding-left:26px;\">\n          <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#E0B44A;\">Critique<\u002Fdiv>\n          <div style=\"font-size:13.5px; line-height:1.62; color:#C9C9C0; text-wrap:pretty; display:flex; flex-direction:column; gap:10px;\">Atmospheric but thin as a system: take away the classified copy and the redaction bars and there's very little left to specify. Also the least ownable — this is the most-copied aesthetic in the entire category. Keep it as a texture pack for 04, not as a standalone brand.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:12px;\"><div style=\"width:300px; height:190px; flex:0 0 300px; background:#191C1F; color:#EDEFF2; overflow:hidden; padding:9px; display:flex; flex-direction:column; gap:7px;\">\n        <div style=\"display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:5.5px; letter-spacing:0.14em; color:#8A9099;\"><span>SEC 01<\u002Fspan><span>REV 2.4<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1.15fr 1fr; gap:7px;\">\n          <div style=\"font-family:'Barlow Condensed', sans-serif; font-size:27px; font-weight:600; letter-spacing:0.03em; line-height:1;\">B-2 SPIRIT<\u002Fdiv>\n          <div style=\"border:1px solid #4A4E53; padding:4px 5px; font-family:'JetBrains Mono', monospace; font-size:5.2px; letter-spacing:0.1em; line-height:1.8; color:#C9CDD2;\">LO/STR <span style=\"border:1px solid #4A4E53; padding:0 2px;\">®<\u002Fspan><br>LOW OBSERVABLE STRATEGIC BOMBER<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'Barlow Condensed', sans-serif; font-size:13px; letter-spacing:0.22em; color:#C9CDD2;\">NATIONAL PROPERTY<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:5px; font-family:'JetBrains Mono', monospace; font-size:5px; letter-spacing:0.08em; color:#8A9099;\"><div style=\"border:1px solid #33383D; padding:4px;\">PROPERTY OF<br>U.S. GOV<\u002Fdiv><div style=\"border:1px solid #33383D; padding:4px;\">SERIAL<br>AV-0021<\u002Fdiv><div style=\"border:1px solid #33383D; padding:4px;\">STATUS<br>ACTIVE<\u002Fdiv><\u002Fdiv>\n        <div style=\"margin-top:auto; display:flex; gap:5px; align-items:center;\"><div style=\"height:11px; flex:1; background:#33383D;\"><\u002Fdiv><div style=\"font-family:'JetBrains Mono', monospace; font-size:5.5px; letter-spacing:0.12em;\">HIGH SUBSONIC )))<\u002Fdiv><div style=\"background:#EDEFF2; color:#101214; font-family:'JetBrains Mono', monospace; font-size:7px; font-weight:700; padding:1px 5px;\">★ B2<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:300px; height:190px; flex:0 0 300px; background:#C9CDD2; color:#101214; overflow:hidden; display:flex; align-items:center; justify-content:center; position:relative;\">\n        <div style=\"position:absolute; inset:0; background:repeating-linear-gradient(0deg,rgba(16,18,20,0.06) 0 1px,transparent 1px 3px);\"><\u002Fdiv>\n        <div style=\"position:relative; border:2px solid #101214; padding:9px 16px; display:flex; gap:11px; align-items:center; background:#DDE0E4;\">\n          <div style=\"width:24px; height:24px; border:1px solid #101214; display:flex; align-items:center; justify-content:center; font-size:12px;\">★<\u002Fdiv>\n          <div style=\"width:24px; height:24px; border:1px solid #101214; display:flex; align-items:center; justify-content:center; font-size:12px;\">★<\u002Fdiv>\n          <div style=\"width:24px; height:24px; border:1px solid #101214; display:flex; align-items:center; justify-content:center; font-size:12px;\">★<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:absolute; bottom:14px; left:0; right:0; text-align:center; font-family:'JetBrains Mono', monospace; font-size:7px; letter-spacing:0.16em;\">AMERICAN AUTOMATION COMPANY<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:300px; height:190px; flex:0 0 300px; background:linear-gradient(115deg,#8E9296 0%,#EDEFF2 18%,#A8ACB0 34%,#F2F4F6 52%,#9A9EA2 68%,#E4E6E9 84%,#8E9296 100%); overflow:hidden; display:flex; align-items:center; justify-content:center; position:relative;\">\n        <div style=\"position:absolute; inset:0; background:repeating-linear-gradient(72deg,rgba(255,255,255,0.35) 0 2px,transparent 2px 9px), repeating-linear-gradient(-40deg,rgba(0,0,0,0.09) 0 3px,transparent 3px 14px);\"><\u002Fdiv>\n        <div style=\"position:relative; display:flex; gap:6px; align-items:center;\"><div style=\"width:34px; height:20px; background:#7E8286; box-shadow:inset 0 1px 2px rgba(255,255,255,0.6);\"><\u002Fdiv><div style=\"width:34px; height:20px; background:#7E8286; box-shadow:inset 0 1px 2px rgba(255,255,255,0.6);\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"position:absolute; right:11px; bottom:11px; width:15px; height:15px; border:1px solid #4A4E53; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono', monospace; font-size:6px; color:#3A3E43;\">R<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:30px 34px;\"><div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Type<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Mono-dominant. Headline is a wide condensed gothic or a stencil face (Eurostile / DIN-adjacent) in caps at +4% tracking; body is 6–8px mono. Almost no sentence case anywhere — deliberate, and part of why it feels cold. <span style=\"color:#7C7C73; font-family:'JetBrains Mono', monospace; font-size:10px;\">Sub: Barlow Condensed 600 / JetBrains Mono<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Shape &amp; line<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Radius 0. Boxed compartments with 1px light-grey borders on dark; every element sits inside a labelled cell. Dense 16-cell modular grid, deliberately overfilled.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Texture &amp; material<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Solid redaction bars. Photocopy noise and low-contrast grain. Faceted low-poly silhouettes. Occasional foil/mylar photography — crumpled silver as a material stand-in for stealth skin.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Layout archetypes<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Dossier sheet: classification strip top, subject silhouette centre, three-column data compartments, stamp block bottom-right. Also a plain black card with a single caged wordmark.<\u002Fdiv>\n      <\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#6F6F68; border-bottom:1px solid #26261F; padding-bottom:7px;\">Marks<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.62; color:#BEBEB4; text-wrap:pretty;\">Star-in-box, chevrons, ⊕ targets, sound-wave arcs ))) , caged and boxed initials, barcode strips.<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<section id=\"s07\" data-screen-label=\"07 Nucleus Engineering Office\" style=\"border-top:1px solid #23231F; padding:52px 0 58px; scroll-margin-top:74px;\">\n    <div style=\"width:100%; max-width:1180px; margin:0 auto; padding:0 32px; display:flex; flex-direction:column; gap:36px;\">\n      <div style=\"display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:44px; align-items:start;\">\n        <div style=\"display:flex; flex-direction:column; gap:16px;\"><div style=\"display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap;\"><span style=\"font-family:'JetBrains Mono', monospace; font-size:11px; color:#6F6F68;\">07<\u002Fspan><span style=\"font-size:27px; font-weight:700; letter-spacing:-0.02em;\">Nucleus Engineering Office<\u002Fspan><span style=\"font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.14em; padding:3px 7px; border:1px solid #4A4A42; color:#B9B9AE;\">CORE<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:14px; line-height:1.55; color:#C9C9C0; text-wrap:pretty;\">Cream-stock field manual: letterpress warmth, circular seals, editorial serif set against mono. The only system on the board with a human hand in it.<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:6px;\"><div style=\"height:52px; background:#F4EFDF;\"><\u002Fdiv><div style=\"height:52px; background:#E6DEC5;\"><\u002Fdiv><div style=\"height:52px; background:#8A7F63;\"><\u002Fdiv><div style=\"height:52px; background:#1A1A17;\"><\u002Fdiv><div style=\"height:52px; background:#B4472E;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:6px; font-family:'JetBrains Mono', monospace; font-size:9px; color:#7C7C73;\"><span>#F4EFDF<\u002Fspan><span>#E6DEC5<\u002Fspan><span>#8A7F63<\u002Fspan><span>#1A1A17<\u002Fspan><span>#B4472E<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono', monospace; font-size:10px; line-height:1.7; color:#7C7C73;\">Evidence: Nucleus Engineering Office / REINDUSTRIALIZE / Machine Age Modernism / Field Manual<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:9px; border-left:1px solid #26261F; padding-left:26px;\">\n          <div style=\"font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#E0B44A;\">Critique<\u002Fdiv>\n          <div style=\"font-size:13.5px; line-height:1.62; color:#C9C9C0; text-wrap:pretty; display:flex; flex-direction:column; gap:10px;\">The genuine outlier and the most valuable thing in the library, precisely because it isn't orange-on-black. Watch the occult flourishes (eye, triangle) — they're borrowed atmosphere and cheapen the craft. Push the letterpress, drop the mysticism.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:12px;\"><div style=\"width:300px; height:190px; flex:0 0 300px; background:#F4EFDF; color:#1A1A17; overflow:hidden; display:flex; align-items:center; justify-content:center; position:relative;\">\n        <div style=\"position:absolute; inset:9px; border:1px solid #C9BE9B;\"><\u002Fdiv>\n        <div style=\"position:relative; width:112px; height:112px; border:1px solid #1A1A17; border-radius:50%; display:flex; align-items:center; justify-content:center;\">\n          <div style=\"width:88px; height:88px; border:1px solid #8A7F63; border-radius:50%; display:flex; align-items:center; justify-content:center;\">\n            <div style=\"width:34px; height:34px; border:1px solid #1A1A17; border-radius:50%; position:relative;\"><div style=\"position:absolute; inset:-9px 4px; border:1px solid #8A7F63; border-radius:50%; transform:rotate(35deg);\"><\u002Fdiv><div style=\"position:absolute; inset:-9px 4px; border:1px solid #8A7F63; border-radius:50%; transform:rotate(-35deg);\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:absolute; top:26px; left:0; right:0; text-align:center; font-family:'Barlow Condensed', sans-serif; font-size:9px; letter-spacing:0.3em;\">NUCLEUS ENGINEERING OFFICE<\u002Fdiv>\n        <div style=\"position:absolute; bottom:26px; left:0; right:0; text-align:center; font-family:'Barlow Condensed', sans-serif; font-size:9px; letter-spacing:0.3em;\">REINDUSTRIALIZE<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:300px; height:190px; flex:0 0 300px; background:#F4EFDF; color:#1A1A17; overflow:hidden; padding:11px 13px; display:flex; flex-direction:column; justify-content:space-between;\">\n        <div style=\"display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:5.6px; letter-spacing:0.12em; border-bottom:1px solid #1A1A17; padding-bottom:5px;\"><span>ISSUE 01.<\u002Fspan><span>OPEN SOURCE<\u002Fspan><span>[ U.S.A ]<\u002Fspan><\u002Fdiv>\n        <div style=\"font-family:'Instrument Serif', serif; font-size:27px; line-height:1.02; letter-spacing:-0.01em;\">Machine Age<br>Modernism <span style=\"font-size:12px; vertical-align:super;\">®<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end;\">\n          <div style=\"font-family:'JetBrains Mono', monospace; font-size:5.4px; line-height:1.9; letter-spacing:0.06em; color:#5A5344;\">DOCUMENTING AI, INTELLIGENCE,<br>INDUSTRY AND INFRASTRUCTURE<br>PUBLIC CIRCULATION<\u002Fdiv>\n          <div style=\"font-family:'Barlow Condensed', sans-serif; font-size:9px; letter-spacing:0.22em; text-align:right;\">FIELD MANUAL<br>FOR THE NEW<br>AMERICAN BUILDER<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; justify-content:space-between; align-items:center; border-top:1px solid #1A1A17; padding-top:5px;\"><span style=\"font-family:'JetBrains Mono', monospace; font-size:5.4px; letter-spacing:0.1em; color:#5A5344;\">THE IMPERIAL TIMES · NYC<\u002Fspan><span style=\"font-family:'Instrument Serif', serif; font-size:20px;\">0–1<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:300px; height:190px; flex:0 0 300px; background:#E6DEC5; color:#1A1A17; overflow:hidden; padding:12px 14px; display:grid; grid-template-columns:1fr 1fr; gap:12px;\">\n        <div style=\"border-right:1px solid #B7AC8C; padding-right:11px; display:flex; flex-direction:column; gap:6px;\">\n          <div style=\"font-family:'Barlow Condensed', sans-serif; font-size:10px; letter-spacing:0.24em;\">SECTION II<\u002Fdiv>\n          <div style=\"font-family:'Instrument Serif', serif; font-size:17px; line-height:1.1;\">On th
