<style>
@import url('https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap');

:root {
  --electric-teal: #66FFE0;
  --mid-teal: #0A6E6E;
  --dark-teal: #053D3D;
  --light-interface: #E0FFF6;
  --mist-teal: #B8E8E0;
  --dark-grey: #1A1A1A;
  --mid-grey: #6F6F6F;
  --light-grey: #DDD;
  --very-light-grey: #F7F7F7;
  --white: #FFFFFF;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "General Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--very-light-grey);
  color: var(--dark-grey);
  line-height: 1.5;
}

/* ── Layout ── */
.admin-header {
  background: var(--dark-teal);
  color: var(--white);
  padding: 20px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.admin-header h1 {
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 10px;
}

.admin-header .back-link {
  color: var(--mist-teal);
  text-decoration: none;
  font-family: "Space Mono", monospace;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
.admin-header .back-link:hover { color: var(--electric-teal); }

.admin-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  min-height: calc(100vh - 62px);
}

@media (max-width: 1024px) {
  .admin-body { grid-template-columns: 1fr; }
}

/* ── Editor Panel ── */
.editor {
  padding: 32px;
  overflow-y: auto;
  max-height: calc(100vh - 62px);
  background: var(--white);
  border-right: 1px solid var(--light-grey);
}

.field {
  margin-bottom: 20px;
}

.field label {
  display: block;
  font-family: "Space Mono", monospace;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--mid-teal);
  margin-bottom: 6px;
  font-weight: 400;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--light-grey);
  border-radius: 5px;
  font-family: "General Sans", sans-serif;
  font-size: 0.95rem;
  color: var(--dark-grey);
  background: var(--white);
  outline: none;
  transition: border-color 0.2s;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--mid-teal);
}

.field textarea {
  font-family: "Space Mono", monospace;
  font-size: 0.85rem;
  line-height: 1.6;
  resize: vertical;
}

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.field-row-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
}

.field .hint {
  font-size: 0.75rem;
  color: var(--mid-grey);
  margin-top: 4px;
}

/* ── Buttons ── */
.btn-row {
  display: flex;
  gap: 12px;
  margin-top: 24px;
  flex-wrap: wrap;
}

.btn {
  padding: 10px 24px;
  border: none;
  border-radius: 5px;
  font-family: "Space Mono", monospace;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 400;
}

.btn-primary {
  background: var(--dark-teal);
  color: var(--white);
}
.btn-primary:hover { background: var(--mid-teal); }

.btn-secondary {
  background: var(--light-interface);
  color: var(--dark-teal);
  border: 1px solid var(--mist-teal);
}
.btn-secondary:hover { background: var(--mist-teal); }

.btn-ghost {
  background: transparent;
  color: var(--mid-teal);
  border: 1px solid var(--light-grey);
}
.btn-ghost:hover { border-color: var(--mid-teal); }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--dark-teal);
  color: var(--white);
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 0.85rem;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.3s;
  pointer-events: none;
  z-index: 999;
}
.toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* ── Preview Panel ── */
.preview-panel {
  overflow-y: auto;
  max-height: calc(100vh - 62px);
  background: var(--very-light-grey);
}

.preview-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--mid-grey);
  font-size: 0.9rem;
  padding: 32px;
  text-align: center;
}

.preview-frame {
  background: var(--white);
  margin: 24px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 20px rgba(0,0,0,0.06);
}

/* ── Manifest Output ── */
.manifest-output {
  margin-top: 20px;
  display: none;
}

.manifest-output pre {
  background: var(--very-light-grey);
  border: 1px solid var(--light-grey);
  padding: 16px;
  border-radius: 8px;
  font-family: "Space Mono", monospace;
  font-size: 0.8rem;
  line-height: 1.6;
  overflow-x: auto;
  color: var(--dark-grey);
}

/* ── Section divider ── */
.divider {
  border: none;
  border-top: 1px solid var(--light-grey);
  margin: 28px 0;
}
</style>
</head>

  // ── Auto-slug from title ──
  var titleEl = document.getElementById('title');
  var slugEl = document.getElementById('slug');
  var slugManual = false;

  slugEl.addEventListener('input', function() { slugManual = true; });

  titleEl.addEventListener('input', function() {
    if (!slugManual || !slugEl.value) {
      slugEl.value = titleEl.value
        .toLowerCase()
        .replace(/[^a-z0-9\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
      slugManual = false;
    }
  });

  var dateEl = document.getElementById('date');
  var today = new Date();
  dateEl.value = today.toISOString().split('T')[0];

    customField.style.display = catEl.value === 'Custom' ? '' : 'none';
  });

    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
  }

  // ── Get category value ──

    if (catEl.value === 'Custom') {
      return document.getElementById('customCategory').value || 'Uncategorised';

    return catEl.value;

  marked.setOptions({
    breaks: false,
    gfm: true,
    headerIds: false,
    mangle: false
  });

  // ── Custom renderer ──
  var renderer = new marked.Renderer();
  var sectionCounter = 0;

  renderer.heading = function(text, level) {
    if (typeof text === 'object' && text.text) text = text.text;
    if (typeof level === 'undefined' && typeof text === 'object') level = text.depth;

    if (level === 2) {
      sectionCounter++;
      var num = sectionCounter < 10 ? '0' + sectionCounter : '' + sectionCounter;
      var parts = text.split(' / ');
      var pretitleText, headingText;
      if (parts.length === 2) {
        pretitleText = parts[0].trim();
        headingText = parts[1].trim();
      } else {
        pretitleText = num + ' / ' + text.split('.')[0].replace(/[^A-Za-z\s]/g,'').trim().substring(0, 30);
        headingText = text;
      }
      return '<div class="pretitle"><span class="square"></span> ' + pretitleText + '</div>\n<h2>' + headingText + '</h2>\n';
    }
    if (level === 3) {
      return '<h3>' + text + '</h3>\n';
    }
    return '<h' + level + '>' + text + '</h' + level + '>\n';
  };

  renderer.blockquote = function(body) {
    if (typeof body === 'object' && body.text) body = body.text;
    var clean = body.replace(/<\/?p>/g, '').trim();
    if (clean.length > 120) {
      return '<div class="callout">\n<p>' + clean + '</p>\n</div>\n';
    }
    return '<div class="pull-quote">' + clean + '</div>\n';
  };

  renderer.table = function(header, body) {
    if (typeof header === 'object') {
      var rows = header.rows || [];
      var hdr = header.header || [];
      var headerHtml = '<tr>' + hdr.map(function(cell) {
        return '<th>' + cell.text + '</th>';
      }).join('') + '</tr>';
      var bodyHtml = rows.map(function(row) {
        return '<tr>' + row.map(function(cell) {
          return '<td>' + cell.text + '</td>';
        }).join('') + '</tr>';
      }).join('\n');
      return '<div class="table-wrap"><table>\n<thead>' + headerHtml + '</thead>\n<tbody>' + bodyHtml + '</tbody>\n</table></div>\n';
    }
    return '<div class="table-wrap"><table>\n<thead>' + header + '</thead>\n<tbody>' + body + '</tbody>\n</table></div>\n';
  };

  marked.use({ renderer: renderer });

  // ── Store generated HTML ──
  var generatedHTML = '';

  // ── Generate ──
  window.generate = function() {
    var title = titleEl.value.trim();
    var sub = document.getElementById('subtitle').value.trim();
    var cat = getCategory();
    var dateVal = dateEl.value;
    var md = document.getElementById('markdown').value;

    if (!title) { showToast('Title is required'); return; }
    if (!md.trim()) { showToast('Paste some markdown content'); return; }

    sectionCounter = 0;
    var bodyHTML = marked.parse(md);

    var postHTML = '<!DOCTYPE html>\n<html lang="en">\n<head>\n'
      + '<meta charset="UTF-8">\n'
      + '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
      + '<title>' + escapeHTML(title) + ' — Optiflows</title>\n'
      + '<style>\n' + POST_CSS + '\n</style>\n'
      + '</head>\n<body>\n\n'
      + '<div class="top-bar"></div>\n\n'
      + '<div class="header">\n'
      + '  <div class="logo-mark">\n'
      + '    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">\n'
      + '      <circle cx="20" cy="20" r="18" stroke="#66FFE0" stroke-width="2" fill="none"/>\n'
      + '      <line x1="14" y1="20" x2="26" y2="20" stroke="#66FFE0" stroke-width="2"/>\n'
      + '      <line x1="20" y1="14" x2="20" y2="26" stroke="#66FFE0" stroke-width="2"/>\n'
      + '    </svg>\n'
      + '  </div>\n'
      + '  <h1>' + escapeHTML(title) + '</h1>\n'
      + (sub ? '  <div class="subtitle">' + escapeHTML(sub) + '</div>\n' : '')
      + '  <div class="meta">' + escapeHTML(cat) + ' &mdash; ' + formatDateDisplay(dateVal) + ' &mdash; ' + readTime(md) + ' read</div>\n'
      + '</div>\n\n'
      + '<section class="section-white">\n<div class="container">\n\n'
      + '<a href="../" class="back-to-blog">&larr; All articles</a>\n\n'
      + bodyHTML
      + '\n</div>\n</section>\n\n'
      + '<div class="footer">\n'
      + '  OptiFlows Pty Ltd &mdash; optiflows.com.au\n'
      + '</div>\n\n'
      + '</body>\n</html>';

    generatedHTML = postHTML;

    // Show preview
    var panel = document.getElementById('previewPanel');
    var empty = document.getElementById('previewEmpty');
    if (empty) empty.remove();

    panel.innerHTML = '<div class="preview-frame"><iframe id="previewIframe" style="width:100%;border:none;min-height:800px;" sandbox="allow-same-origin"></iframe></div>';

    var iframe = document.getElementById('previewIframe');
    iframe.srcdoc = postHTML;
    iframe.onload = function() {
      iframe.style.height = iframe.contentDocument.documentElement.scrollHeight + 'px';
    };

    // Show manifest
    var manifestEl = document.getElementById('manifestOutput');
    manifestEl.style.display = '';
    document.getElementById('manifestJSON').textContent = JSON.stringify({
      slug: slugEl.value || 'untitled',
      title: title,
      excerpt: document.getElementById('excerpt').value.trim() || title,
      category: cat,
      date: dateVal,
      readTime: readTime(md),
      featured: document.getElementById('featured').value === 'true'
    }, null, 2);

    showToast('Post generated');
  };

  // ── Download HTML ──
  window.downloadHTML = function() {
    if (!generatedHTML) { showToast('Generate a post first'); return; }
    var slug = slugEl.value || 'untitled';
    var blob = new Blob([generatedHTML], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = slug + '.html';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('Downloaded ' + slug + '.html');
  };

  // ── Copy manifest entry ──
  window.copyManifest = function() {
    var json = document.getElementById('manifestJSON');
    if (!json || !json.textContent) { showToast('Generate a post first'); return; }
    navigator.clipboard.writeText(json.textContent).then(function() {
      showToast('Manifest entry copied');
    });
  };

  // ── Escape HTML ──
  function escapeHTML(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

})();
</script>
</body>
</html>
