<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Where in the Peninsula is PI? Case 01 asset renderer</title>
  <style>
    @font-face{font-family:Sora;src:url("assets/fonts/sora-600.woff2") format("woff2");font-weight:600;font-display:block}
    @font-face{font-family:Sora;src:url("assets/fonts/sora-700.woff2") format("woff2");font-weight:700;font-display:block}
    @font-face{font-family:Sora;src:url("assets/fonts/sora-800.woff2") format("woff2");font-weight:800;font-display:block}
    @font-face{font-family:Figtree;src:url("assets/fonts/figtree-400.woff2") format("woff2");font-weight:400;font-display:block}
    @font-face{font-family:Figtree;src:url("assets/fonts/figtree-600.woff2") format("woff2");font-weight:600;font-display:block}
    /* Harbour palette, production 2026-07-25. Every colour on a tile comes from this list; check-where-is-pi.mjs asserts it. */
    :root{--deep:#0B2E4A;--harbour:#10527E;--sand:#F5C177;--signal:#E2562F;--paper:#F2EFEA;--white:#FDFCFA;--ink:#14202A}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--deep)}
    body{font-family:Figtree,Arial,sans-serif;color:var(--white)}
    .frame{position:relative;width:100vw;height:100vh;overflow:hidden;isolation:isolate;background:var(--deep)}

    /* The plate sits in the lower zone and fades into the flat ground above it. The ground is flat colour, never a scrim over the painting. */
    /* --plate-top is set per asset so the copy block always ends on flat ground. */
    .plate{position:absolute;z-index:0;left:0;right:0;bottom:0;top:var(--plate-top,34%);width:100%;height:calc(100% - var(--plate-top,34%));object-fit:cover;object-position:var(--plate-pos,center 40%);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26%);mask-image:linear-gradient(to bottom,transparent 0,#000 26%)}
    .frame[data-plate="none"] .plate{display:none}

    .safe{position:absolute;z-index:3;inset:0;padding:64px 68px;display:flex;flex-direction:column}
    .mast{display:flex;align-items:flex-start;justify-content:space-between;gap:30px}
    /* The shadow reads against the navy ground, so it is black at low alpha, not navy-on-navy. */
    .brand{display:inline-flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;background:var(--white);border-radius:14px;color:var(--ink);font:700 24px/1 Sora,Arial,sans-serif;letter-spacing:-.03em;box-shadow:0 10px 28px rgba(0,0,0,.28)}
    .brand img{width:44px;height:44px;border-radius:11px;display:block}
    .brand b{font-weight:700;color:var(--harbour)}
    /* Sand, not Signal: #E2562F on the Harbour ground is 3.7:1, under the 4.5:1 floor at this size. */
    .badge{display:inline-flex;align-items:center;gap:10px;margin-top:14px;color:var(--sand);font:600 13px/1 Sora,Arial,sans-serif;letter-spacing:.17em;text-transform:uppercase}
    .badge:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--signal)}
    .frame[data-release="1"] .badge{display:none}

    .copy{width:100%;margin-top:78px}
    .kicker{margin:0 0 20px;color:var(--sand);font:600 15px/1 Sora,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;max-width:900px;font:800 88px/.94 Sora,Arial,sans-serif;letter-spacing:-.04em;text-wrap:balance}
    h1.quote{font-weight:700;font-size:64px;line-height:1.06;letter-spacing:-.03em}
    .deck{max-width:760px;margin:26px 0 0;color:rgba(253,252,250,.92);font:400 27px/1.34 Figtree,Arial,sans-serif;text-wrap:balance}
    .action{display:flex;align-items:center;justify-content:space-between;gap:28px;margin-top:40px;padding-top:22px;border-top:1px solid rgba(253,252,250,.38);font:600 15px/1.2 Sora,Arial,sans-serif;letter-spacing:.075em;text-transform:uppercase}
    .action b{display:inline-flex;align-items:center;gap:14px;font-weight:600}
    .action b svg{width:24px;height:24px;color:var(--signal);flex:0 0 auto}
    .action span{color:rgba(253,252,250,.78);font:600 13px/1.2 Figtree,Arial,sans-serif;letter-spacing:.12em;text-transform:none}
    .note{max-width:820px;margin:18px 0 0;color:rgba(253,252,250,.74);font:400 15px/1.45 Figtree,Arial,sans-serif}

    .foot{position:absolute;z-index:4;left:68px;right:68px;bottom:56px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;pointer-events:none}
    .counter{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:50%;background:var(--sand);color:var(--ink);font:700 20px/1 Sora,Arial,sans-serif;letter-spacing:-.02em}
    .meta{margin-left:auto;text-align:right;color:rgba(253,252,250,.86);font:600 12px/1.5 Figtree,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
    .meta span{display:block}
    /* When the figure occupies the lower right, the caption moves beside the counter so it never sits on her. */
    .frame[data-meta="left"] .foot{justify-content:flex-start;gap:18px}
    .frame[data-meta="left"] .meta{margin-left:0;text-align:left}

    /* PI mark for the hook slide: the character's own disc replaces a stock question mark.
       pi-concierge.svg is inset within its square canvas (the brim reaches the edges, the disc does not),
       so it runs larger and further off the corner than a disc that filled its viewBox would. */
    .mark{position:absolute;z-index:2;right:-1%;bottom:-8%;width:72%;aspect-ratio:1;display:none}
    .mark img{width:100%;height:100%;display:block;filter:drop-shadow(0 30px 60px rgba(0,0,0,.28))}
    .frame[data-mark="pi"] .mark{display:block}
    .frame[data-mark="pi"] .plate{display:none}
    .frame[data-mark="pi"] .copy{max-width:64%}
    .frame[data-mark="pi"] .meta{display:none} /* the counter identifies the slide; metadata would sit on the disc */

    /* Story 1080x1920 */
    .format-story .safe{padding:120px 76px 220px}
    .format-story .copy{margin-top:96px}
    .format-story h1{font-size:98px;max-width:900px}
    .format-story h1.quote{font-size:68px}
    .format-story .deck{font-size:30px;max-width:820px}
    .format-story .action{margin-top:48px;font-size:16px}
    .format-story .foot{bottom:170px;left:76px;right:76px}
    .format-story .mark{width:88%;right:-14%;bottom:8%}

    /* Wide 1920x1080: flat column left, plate right, masked on its left edge. The copy column ends before the mask begins. */
    .format-wide .plate{top:0;height:100%;left:auto;right:0;width:62%;object-position:var(--plate-pos,center 45%);-webkit-mask-image:linear-gradient(to right,transparent 0,#000 38%);mask-image:linear-gradient(to right,transparent 0,#000 38%)}
    .format-wide .safe{padding:52px 64px}
    .format-wide .mast{justify-content:flex-start;gap:28px;align-items:center} /* badge stays on the flat column, off the painting */
    .format-wide .badge{margin-top:0}
    .format-wide .copy{width:40%;margin-top:64px}
    .format-wide h1{font-size:78px;max-width:760px}
    .format-wide .deck{font-size:24px;max-width:640px;margin-top:22px}
    .format-wide .action{max-width:100%;margin-top:32px}
    .format-wide .note{max-width:100%}
    .format-wide .foot{left:64px;right:64px;bottom:44px}
    .format-wide .brand{font-size:22px}.format-wide .brand img{width:40px;height:40px}

    .debug{position:fixed;z-index:10;right:12px;bottom:12px;padding:8px 10px;border-radius:6px;background:#fff;color:#111;font:12px monospace}
    body.capture .debug{display:none}
  </style>
</head>
<body>
  <main class="frame" id="frame">
    <img class="plate" id="plate" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
    <div class="mark" aria-hidden="true"><img src="assets/pi-concierge.svg" alt=""></div>
    <div class="safe">
      <header class="mast">
        <div class="brand"><img src="assets/pi-site-icon.svg" alt=""><span>Peninsula <b>Insider</b></span></div>
        <div class="badge">Review only · Unpublished</div>
      </header>
      <section class="copy">
        <p class="kicker" id="kicker"></p>
        <h1 id="headline"></h1>
        <p class="deck" id="deck"></p>
        <div class="action" id="action"><b id="cta"></b><span id="url"></span></div>
        <p class="note" id="note"></p>
      </section>
    </div>
    <div class="foot"><span class="counter" id="counter"></span><div class="meta" id="meta"></div></div>
  </main>
  <div class="debug" id="debug"></div>
  <script>
    // Single source of truth for every string on every tile. The CTA URL and the prize line come from
    // creative-provenance.json (copy block) and must stay byte-identical to it; check-where-is-pi.mjs diffs them.
    const URL_CTA = "play.peninsulainsider.com.au";
    const PRIZE = "Play and go in the draw for $250 to dine at Doot Doot Doot, Jackalope. Draw closes Sunday 11 October 2026.";
    const PLATES = {
      // v2 plates carry PI leaving the frame (GPT Image 2.5, STYLE FORMULA byte-identical). v1 plates are the empty scenes.
      morningtonV2: "assets/masters/v2/plate-01-mornington-feed-4x5-v2.png",
      morningtonStoryV2: "assets/masters/v2/plate-mornington-story-9x16-v2.png",
      morningtonWideV2: "assets/masters/v2/plate-mornington-wide-16x9-v2.png",
      capeSchanckFeedV2: "assets/masters/v2/plate-cape-schanck-feed-4x5-v2.png",
      capeSchanckStoryV2: "assets/masters/v2/plate-cape-schanck-story-9x16-v2.png",
      capeSchanckWideV2: "assets/masters/v2/plate-cape-schanck-wide-16x9-v2.png",
      mainRidgeFeedV2: "assets/masters/v2/plate-main-ridge-feed-4x5-v2.png",
      mainRidgeStoryV2: "assets/masters/v2/plate-main-ridge-story-9x16-v2.png",
      mainRidgeWideV2: "assets/masters/v2/plate-main-ridge-wide-16x9-v2.png",
      redHillFeedV2: "assets/masters/v2/plate-red-hill-feed-4x5-v2.png",
      redHillStoryV2: "assets/masters/v2/plate-red-hill-story-9x16-v2.png",
      redHillWideV2: "assets/masters/v2/plate-red-hill-wide-16x9-v2.png",
      mornington: "assets/masters/plate-01-mornington-feed-4x5.png",
      morningtonWide: "assets/masters/plate-02-mornington-wide-16x9.png",
      capeSchanck: "assets/masters/plate-03-cape-schanck-story-9x16.png"
    };
    const ASSETS = {
      // plateTop: where the painting begins (the copy block must end above it). pos: object-position for the crop.
      "feed-01":     {format:"feed",  plate:"morningtonV2", plateTop:"46%", pos:"center 62%", kicker:"Case 01 · Last seen, Mornington", headline:"She took her coffee to go.", deck:"Can you find her?", cta:"Play Case 01", url:URL_CTA, note:PRIZE, counter:"", meta:["FEED-01 · CASE 01","Original illustration"]},
      "carousel-01": {format:"feed",  plate:"", mark:"pi", kicker:"Case 01 is open", headline:"Where in the Peninsula is PI?", deck:"Four towns. One Insider. Find her before Sunday 11 October.", cta:"", url:"", note:"", counter:"1/5", meta:[]},
      "carousel-02": {format:"feed",  plate:"mornington", plateTop:"34%", pos:"center 40%", kicker:"Last seen", headline:"Mornington pier. Saturday, 8:10am.", deck:"Flat white, takeaway. The dog was with her.", cta:"", url:"", note:"", counter:"2/5", meta:["CAROUSEL 2/5 · THE CASE","Original illustration"]},
      "carousel-03": {format:"feed",  plate:"capeSchanckFeedV2", plateTop:"36%", pos:"center 58%", kicker:"How it works", headline:"The sun moves only when you do.", deck:"Ask the witnesses. Search the scene. Read the land. Catch her before last light.", cta:"", url:"", note:"", counter:"3/5", meta:["CAROUSEL 3/5 · MECHANIC","Original illustration"]},
      "carousel-04": {format:"feed",  plate:"mornington", plateTop:"44%", pos:"left 58%", kicker:"Witness · The barista", headline:"“Took her coffee to go. Asked me which way the wind was blowing.”", quote:true, deck:"Three witnesses at every stop. One of them is sending you the wrong way.", cta:"", url:"", note:"", counter:"4/5", meta:["CAROUSEL 4/5 · WITNESS","Original illustration"]},
      "carousel-05": {format:"feed",  plate:"morningtonV2", plateTop:"48%", pos:"center 66%", kicker:"Case 01 · Open now", headline:"Play Case 01.", deck:"Find her before Sunday 11 October.", cta:"Open the case", url:URL_CTA, note:PRIZE, counter:"5/5", meta:["CAROUSEL 5/5 · CALL TO ACTION","Original illustration"]},
      "story-01":    {format:"story", plate:"morningtonStoryV2", plateTop:"36%", pos:"center 60%", kicker:"Case 01", headline:"She took her coffee to go.", deck:"Can you find her?", cta:"", url:"", note:"", counter:"1/3", meta:["STORY 1/3 · HOOK","Original illustration"]},
      "story-02":    {format:"story", plate:"capeSchanckStoryV2", plateTop:"42%", pos:"center 62%", kicker:"How it works", headline:"Four towns. One Insider. One afternoon.", deck:"The sun moves only when you do.", cta:"", url:"", note:"", counter:"2/3", meta:["STORY 2/3 · CHALLENGE","Original illustration"]},
      "story-03":    {format:"story", plate:"morningtonV2", plateTop:"46%", pos:"center 70%", kicker:"Case 01 · Open now", headline:"Play Case 01.", deck:"Find her before Sunday 11 October.", cta:"Open the case", url:URL_CTA, note:PRIZE, counter:"3/3", meta:["STORY 3/3 · CALL TO ACTION","Original illustration"]},
      "hero-wide":   {format:"wide",  plate:"morningtonWideV2", pos:"center 45%", kicker:"Case 01 · Last seen, Mornington", headline:"She took her coffee to go.", deck:"Can you find her? Case 01 of Where in the Peninsula is PI? is open.", cta:"Play Case 01", url:URL_CTA, note:PRIZE, counter:"", meta:["HERO-WIDE · CASE 01","Original illustration"]},
      // Weeks 2 and 3: the assets the calendar promised. Main Ridge and Red Hill are later stops, shown but never named as the route.
      "feed-02":     {format:"feed",  plate:"mainRidgeFeedV2", plateTop:"46%", pos:"center 60%", kicker:"Case 01 · Still open", headline:"She’s still out there.", deck:"Somewhere with a view. Play before Sunday 11 October.", cta:"Play Case 01", url:URL_CTA, note:PRIZE, counter:"", meta:["FEED-02 · WEEK 2","Original illustration"]},
      "feed-03":     {format:"feed",  plate:"redHillFeedV2", plateTop:"46%", pos:"center 60%", kicker:"Case 01 · Closing", headline:"Draw closes Sunday.", deck:"Last light on the ridge. Find her before 11 October.", cta:"Play Case 01", url:URL_CTA, note:PRIZE, counter:"", meta:["FEED-03 · WEEK 3 URGENCY","Original illustration"]},
      "story-04":    {format:"story", plate:"redHillStoryV2", plateTop:"44%", pos:"center 62%", kicker:"Case 01 · Final 48 hours", headline:"Last light on the ridge.", deck:"Draw closes Sunday 11 October.", cta:"Open the case", url:URL_CTA, note:PRIZE, counter:"", meta:["STORY-04 · WEEK 3 COUNTDOWN","Original illustration"]},
      "hero-wide-02":{format:"wide",  plate:"redHillWideV2", pos:"center 45%", kicker:"Case 01 · Closing", headline:"Draw closes Sunday.", deck:"Last light on the ridge. Find her before 11 October.", cta:"Play Case 01", url:URL_CTA, note:PRIZE, counter:"", meta:["HERO-WIDE-02 · WEEK 3","Original illustration"]}
    };
    const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    const params = new URLSearchParams(location.search);
    const id = ASSETS[params.get("asset")] ? params.get("asset") : "feed-01";
    const a = ASSETS[id];
    const frame = document.getElementById("frame");
    document.body.classList.add("format-" + a.format);
    frame.classList.add("format-" + a.format);
    frame.dataset.plate = a.plate ? "bleed" : "none";
    if (a.mark) frame.dataset.mark = a.mark;
    if (a.plateTop) frame.style.setProperty("--plate-top", a.plateTop);
    if (/V2$/.test(a.plate || "")) frame.dataset.meta = "left"; // PI exits lower right on every generation-2 plate
    if (a.pos) frame.style.setProperty("--plate-pos", a.pos);
    document.body.classList.toggle("capture", params.get("capture") === "1");
    // release=1 drops the REVIEW ONLY badge. Without it every tile carries the watermark in its pixels,
    // and the only way to get a publishable set would be hand-editing this file.
    if (params.get("release") === "1") frame.dataset.release = "1";
    const plate = document.getElementById("plate");
    if (a.plate) plate.src = PLATES[a.plate]; else plate.remove();
    document.getElementById("kicker").textContent = a.kicker;
    const h1 = document.getElementById("headline"); h1.textContent = a.headline; if (a.quote) h1.classList.add("quote");
    document.getElementById("deck").textContent = a.deck;
    const action = document.getElementById("action");
    if (a.cta) { document.getElementById("cta").innerHTML = a.cta + ARROW; document.getElementById("url").textContent = a.url; } else action.remove();
    const note = document.getElementById("note"); if (a.note) note.textContent = a.note; else note.remove();
    const counter = document.getElementById("counter"); if (a.counter) counter.textContent = a.counter; else counter.remove();
    document.getElementById("meta").innerHTML = a.meta.filter(Boolean).map(s => "<span>" + s + "</span>").join("");
    document.getElementById("debug").textContent = id + " / " + a.format;
    document.title = "PI Case 01 " + id;
    window.__PI_ASSET__ = { id, format: a.format, url: a.url, note: a.note };
  </script>
</body>
</html>
