<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Peninsula Insider October asset renderer</title>
  <style>
    @font-face{font-family:Sora;src:url("assets/fonts/sora-600.woff2") format("woff2");font-weight:600;font-display:swap}
    @font-face{font-family:Sora;src:url("assets/fonts/sora-700.woff2") format("woff2");font-weight:700;font-display:swap}
    @font-face{font-family:Sora;src:url("assets/fonts/sora-800.woff2") format("woff2");font-weight:800;font-display:swap}
    @font-face{font-family:Figtree;src:url("assets/fonts/figtree-400.woff2") format("woff2");font-weight:400;font-display:swap}
    @font-face{font-family:Figtree;src:url("assets/fonts/figtree-600.woff2") format("woff2");font-weight:600;font-display:swap}
    :root{--deep:#071c2b;--harbour:#0b2e4a;--sand:#f5c177;--signal:#f26a4f;--chalk:#f7f3eb;--ink:#1f1d1a}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--deep)}
    body{font-family:Figtree,Arial,sans-serif}
    .frame{position:relative;width:100vw;height:100vh;overflow:hidden;isolation:isolate;background:var(--deep);color:#fff}
    .photograph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.003)}
    .frame:before{content:"";position:absolute;z-index:1;inset:0;background:linear-gradient(180deg,rgba(7,28,43,.15) 0%,rgba(7,28,43,.04) 35%,rgba(7,28,43,.86) 100%)}
    .frame:after{content:"";position:absolute;z-index:2;inset:0;opacity:.16;mix-blend-mode:soft-light;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.42) 0 1px,transparent 1.3px),radial-gradient(circle at 70% 60%,rgba(0,0,0,.32) 0 1px,transparent 1.25px);background-size:7px 7px,11px 11px;pointer-events:none}
    .safe{position:absolute;z-index:3;inset:0;padding:6.3%;display:flex;flex-direction:column}
    .mast{display:flex;align-items:center;justify-content:space-between;gap:30px}
    .brand{display:flex;align-items:center;gap:16px;font:600 24px/1 Sora,Arial,sans-serif;letter-spacing:-.035em}
    .brand img{width:50px;height:50px;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.17)}
    .brand strong{font-weight:800}
    .edition{text-align:right;font:600 13px/1.3 Sora,Arial,sans-serif;letter-spacing:.19em;text-transform:uppercase}
    .edition span{display:block;margin-top:7px;color:rgba(255,255,255,.7);font:600 10px/1.2 Figtree,Arial,sans-serif;letter-spacing:.15em}
    .copy{width:88%;max-width:900px;margin-top:auto;padding-bottom:2.5%}
    .kicker{display:flex;align-items:center;gap:14px;margin:0 0 22px;color:var(--sand);font:600 15px/1 Sora,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}
    .kicker:before{content:"";width:48px;height:4px;border-radius:5px;background:var(--signal)}
    h1{max-width:920px;margin:0;font:800 86px/.91 Sora,Arial,sans-serif;letter-spacing:-.07em;text-wrap:balance;text-shadow:0 8px 34px rgba(0,0,0,.21)}
    .deck{max-width:730px;margin:27px 0 0;color:rgba(255,255,255,.91);font:400 25px/1.35 Figtree,Arial,sans-serif;text-wrap:balance}
    .action{display:flex;align-items:center;justify-content:space-between;gap:28px;margin-top:42px;padding-top:20px;border-top:1px solid rgba(255,255,255,.4);font:600 14px/1.2 Sora,Arial,sans-serif;letter-spacing:.075em;text-transform:uppercase}
    .action b{display:inline-flex;align-items:center;gap:13px;font-weight:600}.action b:after{content:"→";color:var(--signal);font-size:22px}
    .action span{color:rgba(255,255,255,.72);font:600 12px/1.2 Figtree,Arial,sans-serif;letter-spacing:.12em}
    .measure{position:absolute;z-index:3;right:2.3%;top:21%;bottom:21%;width:20px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
    .measure:before{content:"";position:absolute;top:0;bottom:0;left:9px;width:1px;background:rgba(255,255,255,.35)}
    .measure i{position:relative;width:9px;height:9px;border:2px solid rgba(255,255,255,.82);border-radius:50%;background:var(--deep)}
    .measure i.active{width:15px;height:15px;border:4px solid var(--sand);background:var(--signal);box-shadow:0 0 0 5px rgba(242,106,79,.18)}
    .format-wide:before{background:linear-gradient(90deg,rgba(7,28,43,.91) 0%,rgba(7,28,43,.73) 34%,rgba(7,28,43,.15) 68%,rgba(7,28,43,.12) 100%)}
    .format-wide .safe{padding:4.3% 4.8%}
    .format-wide .brand{font-size:21px}.format-wide .brand img{width:46px;height:46px}
    .format-wide .copy{width:52%;margin-top:auto;padding-bottom:0}
    .format-wide h1{font-size:82px;max-width:820px}
    .format-wide .deck{font-size:22px;max-width:650px;margin-top:21px}
    .format-wide .action{max-width:670px;margin-top:30px}
    .format-wide .measure{right:1.65%;top:18%;bottom:18%}
    .format-story .safe{padding:145px 76px 210px}
    .format-story .brand{font-size:25px}.format-story .brand img{width:56px;height:56px}
    .format-story .copy{width:91%;padding-bottom:0}
    .format-story h1{font-size:96px;max-width:880px}
    .format-story .deck{font-size:27px;max-width:760px}
    .format-story .action{margin-top:50px;font-size:15px}
    .format-story .measure{right:2.5%;top:22%;bottom:22%}
    .w3 h1,.w4 h1{font-size:79px}
    .format-story.w3 h1,.format-story.w4 h1{font-size:88px}
    .format-wide.w3 h1,.format-wide.w4 h1{font-size:74px}
    .w1 .photograph{object-position:58% center}
    .w2 .photograph{object-position:50% 55%}
    .w3 .photograph{object-position:44% 55%}
    .w4 .photograph{object-position:47% center}
    .format-wide.w1 .photograph{object-position:58% 54%}
    .format-wide.w2 .photograph{object-position:50% 67%}
    .format-wide.w3 .photograph{object-position:50% 54%}
    .format-wide.w4 .photograph{object-position:53% 57%}
    .format-wide.w1 .copy,.format-wide.w4 .copy{width:48%}
    .debug{position:fixed;z-index:10;right:12px;bottom:12px;padding:8px 10px;border-radius:6px;background:#fff;color:#111;font:12px monospace}
    body.capture .debug{display:none}
  </style>
</head>
<body>
  <main class="frame" id="frame">
    <img class="photograph" id="photograph" alt="">
    <div class="safe">
      <header class="mast">
        <div class="brand"><img src="assets/pi-site-icon.svg" alt=""><span>Peninsula <strong>Insider</strong></span></div>
        <div class="edition">October / 2026<span>In long form</span></div>
      </header>
      <section class="copy">
        <p class="kicker" id="kicker"></p>
        <h1 id="headline"></h1>
        <p class="deck" id="deck"></p>
        <div class="action"><b id="cta"></b><span>peninsulainsider.com.au</span></div>
      </section>
    </div>
    <div class="measure" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </main>
  <div class="debug" id="debug"></div>
  <script>
    const chapters={
      w1:{kicker:"Chapter 01 · Long light",headline:"One more hour. Use it well.",deck:"Three after-five plans for the first longer evening.",cta:"Open the October field guide",image:"assets/masters/w1-one-more-hour-master.jpg"},
      w2:{kicker:"Chapter 02 · Western Port",headline:"Read the other coast.",deck:"Pages, water and a quieter horizon. Plan the day with current access notes.",cta:"Plan a Western Port day",image:"assets/masters/w2-read-other-coast-master.jpg"},
      w3:{kicker:"Chapter 03 · Mornington",headline:"Walk Saturday. Garden Sunday.",deck:"Two separate reasons to keep the Mornington weekend.",cta:"Build your weekend",image:"assets/masters/w3-keep-weekend-master.jpg"},
      w4:{kicker:"Chapter 04 · Point Nepean",headline:"Thirty-five kilometres of coast.",deck:"Join it, support it, or follow the route.",cta:"Read the route guide",image:"assets/masters/w4-long-finish-master.jpg"}
    };
    const params=new URLSearchParams(location.search);
    const week=chapters[params.get("week")]?params.get("week"):"w1";
    const format=["feed","story","wide"].includes(params.get("format"))?params.get("format"):"feed";
    const data=chapters[week];
    const frame=document.getElementById("frame");
    frame.classList.add(week,"format-"+format);
    document.body.classList.toggle("capture",params.get("capture")==="1");
    document.getElementById("photograph").src=data.image;
    document.getElementById("kicker").textContent=data.kicker;
    document.getElementById("headline").textContent=data.headline;
    document.getElementById("deck").textContent=data.deck;
    document.getElementById("cta").textContent=data.cta;
    document.querySelectorAll(".measure i")[Number(week.slice(1))-1].classList.add("active");
    document.getElementById("debug").textContent=week+" / "+format;
    document.title="PI October "+week+" "+format;
  </script>
</body>
</html>
