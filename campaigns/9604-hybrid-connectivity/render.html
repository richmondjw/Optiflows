<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hybrid IoT campaign asset renderer</title>
  <style>
    @font-face{font-family:Titillium;src:url('assets/fonts/titillium-web-400.woff2') format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:Titillium;src:url('assets/fonts/titillium-web-600.woff2') format('woff2');font-weight:600;font-display:swap}
    @font-face{font-family:Titillium;src:url('assets/fonts/titillium-web-700.woff2') format('woff2');font-weight:700;font-display:swap}
    :root{--navy:#020f59;--mint:#aeeddc;--teal:#00afaa;--dark:#003640;--blue:#00677a;--ink:#071d28;--white:#fff;--mist:#eaf7f5}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071d28;font-family:Titillium,Arial,sans-serif}
    .canvas{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--ink);color:#fff}
    .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
    .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,20,29,.96) 0%,rgba(3,20,29,.82) 38%,rgba(3,20,29,.24) 69%,rgba(3,20,29,.08) 100%)}
    .shade::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(2,15,89,.38),transparent 42%)}
    .brand{position:absolute;top:5.5%;left:5.4%;z-index:4;background:rgba(255,255,255,.94);padding:1.2% 1.5%;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18)}
    .brand img{display:block;width:min(23vw,300px);height:auto}
    .copy{position:absolute;z-index:3;left:5.4%;top:30%;width:49%}
    .eyebrow{font-size:clamp(18px,1.65vw,32px);font-weight:700;letter-spacing:.14em;color:var(--mint);text-transform:uppercase;margin:0 0 1.5vh}
    h1{font-size:clamp(54px,5.7vw,104px);line-height:.92;letter-spacing:-.035em;margin:0 0 2.2vh;font-weight:700;max-width:100%;text-wrap:balance}
    .support{font-size:clamp(24px,2.1vw,40px);line-height:1.18;margin:0;max-width:92%;color:#e9f4f4}
    .cta{display:inline-flex;align-items:center;gap:.7em;margin-top:4vh;background:var(--mint);color:var(--navy);font-size:clamp(20px,1.45vw,30px);font-weight:700;padding:.55em 1em;border-radius:999px}
    .cta::after{content:"→"}
    .footer{position:absolute;z-index:4;left:5.4%;right:4%;bottom:4.2%;display:flex;align-items:center;justify-content:space-between;font-size:clamp(18px,1.3vw,26px);font-weight:600;letter-spacing:.035em;color:#fff}
    .footer .line{width:35%;height:2px;background:linear-gradient(90deg,var(--teal),transparent)}
    .orbit{position:absolute;right:-10%;top:-28%;width:54vw;height:54vw;border:2px solid rgba(174,237,220,.3);border-radius:50%;z-index:2}
    .orbit::before,.orbit::after{content:"";position:absolute;width:1.3%;height:1.3%;background:var(--mint);border-radius:50%;box-shadow:0 0 28px var(--teal)}
    .orbit::before{left:18%;bottom:10%}.orbit::after{left:3%;bottom:26%}

    .feed .copy{width:72%;top:29%}.feed .shade{background:linear-gradient(180deg,rgba(3,20,29,.26) 0%,rgba(3,20,29,.44) 32%,rgba(3,20,29,.94) 76%,rgba(3,20,29,.98) 100%)}
    .feed .copy{top:auto;bottom:14%;left:7%;width:86%}.feed h1{font-size:clamp(62px,8.4vw,118px);line-height:.94}.feed .support{font-size:clamp(28px,3.1vw,42px);max-width:90%}.feed .brand{left:7%;top:5%}.feed .brand img{width:min(31vw,320px)}.feed .footer{left:7%;bottom:4.2%}
    .square .copy{top:auto;bottom:16%;left:7%;width:86%}.square .shade{background:linear-gradient(180deg,rgba(3,20,29,.18),rgba(3,20,29,.86) 67%,rgba(3,20,29,.98))}.square h1{font-size:clamp(56px,7.6vw,92px)}.square .support{font-size:clamp(25px,2.8vw,35px)}.square .brand{left:7%;top:6%}.square .brand img{width:min(32vw,300px)}.square .footer{left:7%}
    .story .copy{top:auto;bottom:17%;left:8%;width:84%}.story .shade{background:linear-gradient(180deg,rgba(3,20,29,.12) 0%,rgba(3,20,29,.36) 39%,rgba(3,20,29,.97) 73%,rgba(3,20,29,1) 100%)}.story h1{font-size:clamp(64px,10.5vw,128px);line-height:.92}.story .support{font-size:clamp(31px,4.2vw,48px)}.story .eyebrow{font-size:clamp(21px,2.6vw,30px)}.story .brand{left:8%;top:6.8%;padding:2.4% 3%;border-radius:18px}.story .brand img{width:min(46vw,390px)}.story .footer{left:8%;right:8%;bottom:5.4%;font-size:clamp(20px,2.4vw,28px)}.story .footer .line{display:none}.story .cta{font-size:clamp(26px,3vw,38px)}

    .carousel{background:linear-gradient(145deg,var(--navy),#003640);padding:7%}
    .carousel .brand{top:5%;left:6%;padding:2.1% 2.6%}.carousel .brand img{width:min(34vw,330px)}
    .carousel .progress{position:absolute;right:7%;top:6%;font-size:2.3vw;letter-spacing:.12em;font-weight:700;color:var(--mint);z-index:5}
    .carousel .car-copy{position:absolute;z-index:3;left:7%;right:7%;top:29%}
    .carousel h1{font-size:8.2vw;line-height:.96;max-width:93%;margin:0 0 3.5vh}
    .carousel .car-body{font-size:3.5vw;line-height:1.25;max-width:88%;color:#e9f4f4}
    .carousel .car-kicker{font-size:2.15vw;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mint);margin-bottom:2.5vh}
    .carousel .car-footer{position:absolute;left:7%;right:7%;bottom:6%;display:flex;justify-content:space-between;align-items:end;color:#fff;font-size:2.25vw;font-weight:600;z-index:4}
    .carousel .car-footer strong{color:var(--mint)}
    .carousel.has-scene{padding:0}.carousel.has-scene .shade{background:linear-gradient(180deg,rgba(3,20,29,.2),rgba(2,15,89,.94) 72%,rgba(2,15,89,1))}.carousel.has-scene .car-copy{top:auto;bottom:17%}.carousel.has-scene h1{font-size:7.8vw}.carousel.has-scene .car-body{font-size:3vw}
    .carousel .signal{position:absolute;right:-18%;bottom:-8%;width:72%;aspect-ratio:1;border:2px solid rgba(174,237,220,.22);border-radius:50%}.carousel .signal::after{content:"";position:absolute;inset:14%;border:2px solid rgba(0,175,170,.22);border-radius:50%}

    .email-canvas{background:#e8efef;padding:48px;color:var(--ink)}
    .inbox-bar{height:52px;background:#d8e0e0;border-radius:14px 14px 0 0;display:flex;align-items:center;padding:0 24px;gap:10px;color:#48636a;font-weight:600;font-size:18px}.inbox-bar i{display:block;width:12px;height:12px;background:#aebcbd;border-radius:50%}.inbox-bar i:first-child{background:#ef887d}.inbox-bar i:nth-child(2){background:#efc879}.inbox-bar i:nth-child(3){background:#72c7a5}
    .email-shell{height:calc(100% - 52px);background:white;border-radius:0 0 14px 14px;box-shadow:0 30px 80px rgba(7,29,40,.18);display:grid;grid-template-columns:43% 57%;overflow:hidden}
    .email-art{position:relative;overflow:hidden;background:var(--ink)}.email-art .scene{object-position:center}.email-art .shade{background:linear-gradient(0deg,rgba(2,15,89,.9),transparent 66%)}
    .email-art .art-line{position:absolute;z-index:3;left:8%;right:8%;bottom:8%;font-size:38px;line-height:1;font-weight:700;color:white}.email-art .art-line span{display:block;color:var(--mint);font-size:17px;letter-spacing:.13em;margin-bottom:12px}
    .email-copy{padding:46px 52px 36px;display:flex;flex-direction:column}.email-logo{background:#fff;width:230px;margin-bottom:32px}.email-copy .email-kicker{font-weight:700;color:var(--blue);letter-spacing:.12em;font-size:16px}.email-copy h1{font-size:45px;line-height:.98;color:var(--navy);margin:10px 0 18px}.email-copy p{font-size:20px;line-height:1.38;margin:0 0 13px;color:#30464d}.email-copy ul{display:grid;grid-template-columns:1fr 1fr;gap:7px 22px;margin:4px 0 18px;padding:0;list-style:none}.email-copy li{font-size:17px;color:#30464d}.email-copy li::before{content:"✓";color:var(--teal);font-weight:700;margin-right:8px}.email-button{align-self:flex-start;background:var(--navy);color:#fff;font-weight:700;font-size:18px;padding:13px 22px;border-radius:4px;margin-top:auto}.email-meta{position:absolute;right:62px;bottom:18px;color:#64777c;font-size:14px}

    .site-canvas{background:#dfe8e8;padding:34px;color:var(--ink)}
    .browser{height:100%;background:#fff;border-radius:20px;box-shadow:0 34px 100px rgba(7,29,40,.25);overflow:hidden;position:relative}
    .browser-top{height:52px;background:#edf2f2;display:flex;align-items:center;gap:9px;padding:0 20px}.browser-top i{width:12px;height:12px;border-radius:50%;background:#aab8b8}.browser-top i:first-child{background:#ef887d}.browser-top i:nth-child(2){background:#efc879}.browser-top i:nth-child(3){background:#72c7a5}.address{margin-left:18px;background:white;border:1px solid #d4dddd;border-radius:999px;color:#607277;padding:6px 20px;font-size:14px;width:58%}
    .site-nav{height:82px;display:flex;align-items:center;padding:0 5%;border-bottom:1px solid #dde5e4;background:#fff}.site-nav img{width:220px}.site-links{margin-left:auto;display:flex;gap:28px;font-size:17px;color:#334a52;font-weight:600}.site-button{background:var(--navy);color:#fff;padding:10px 18px;border-radius:4px}
    .site-hero{position:absolute;left:0;right:0;top:134px;bottom:0;display:grid;grid-template-columns:54% 46%;background:#f5f9f8}.site-content{padding:6.5% 8% 4% 9%;position:relative;z-index:2}.site-content .eyebrow{color:var(--blue);font-size:18px;margin-bottom:18px}.site-content h1{font-size:64px;line-height:.96;color:var(--navy);margin:0 0 22px}.site-content p{font-size:24px;line-height:1.3;color:#334a52;max-width:680px;margin:0 0 28px}.site-actions{display:flex;gap:13px}.primary,.secondary{font-size:18px;font-weight:700;padding:13px 20px;border-radius:4px}.primary{background:var(--navy);color:white}.secondary{border:2px solid var(--navy);color:var(--navy)}.site-image{position:relative;overflow:hidden}.site-image .scene{object-position:center}.site-image::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#f5f9f8 0,transparent 24%)}
    .site-facts{display:flex;gap:14px;margin-top:34px}.fact{border-left:3px solid var(--teal);padding-left:13px;font-size:15px;color:#496068;max-width:145px}.fact strong{display:block;color:var(--navy);font-size:19px}
  </style>
  <link rel="stylesheet" href="carousel-story.css?v=independent-brands-1">
</head>
<body>
  <div id="app"></div>
  <script src="campaign-data.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    const type = q.get('type') || 'social';
    const logo = 'assets/brand/m2m-connectivity-logo.svg';
    const master = name => `assets/higgsfield-masters/${name}`;
    const esc = value => String(value || '').replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
    const app = document.getElementById('app');

    function brand(){ return `<div class="brand"><img src="${logo}" alt="M2M Connectivity"></div>`; }
    function scene(name){ return `<img class="scene" src="${master(name)}" alt="">`; }

    function renderSocial(){
      const item = CAMPAIGN.weeks.find(x => x.id === q.get('id')) || CAMPAIGN.weeks[0];
      const format = q.get('format') || 'wide';
      app.innerHTML = `<main class="canvas ${format}">${scene(item.master)}<div class="shade"></div><div class="orbit"></div>${brand()}<section class="copy"><p class="eyebrow">${esc(item.eyebrow)}</p><h1>${esc(item.headline)}</h1><p class="support">${esc(item.support)}</p><span class="cta">${esc(item.cta)}</span></section><footer class="footer"><span>m2mconnectivity.com.au</span><i class="line"></i><span>Iridium Certus 9604</span></footer></main>`;
    }

    function renderCarousel(){
      const item = CAMPAIGN.carousels.find(x => x.id === q.get('id')) || CAMPAIGN.carousels[0];
      const n = Math.max(1, Math.min(item.slides.length, Number(q.get('slide') || 1)));
      const slide = item.slides[n - 1];
      const oneBrand = q.get('brand') === 'm2m-one';
      const carouselBrand = oneBrand ? `<div class="brand"><img class="one-logo" src="assets/brand/m2m-one-logo.png" alt="M2M One"></div>` : brand();
      // Edge y=1080 is invariant: adjacent images retain a continuous route.
      const routes = [
        'M -20 1080 H 640 Q 710 1080 710 1015 V 975 Q 710 935 755 935 H 850 Q 895 935 895 980 V 1015 Q 895 1080 960 1080 H 1100',
        'M -20 1080 H 170 Q 230 1080 230 1030 V 1000 Q 230 950 280 950 H 380 Q 430 950 430 1000 V 1030 Q 430 1080 490 1080 H 1100',
        'M -20 1080 H 610 Q 665 1080 665 1120 Q 665 1160 715 1160 H 850 Q 905 1160 905 1120 Q 905 1080 960 1080 H 1100',
        'M -20 1080 H 240 Q 295 1080 295 1120 Q 295 1160 350 1160 H 420 Q 475 1160 475 1120 Q 475 1080 530 1080 H 1100',
        'M -20 1080 H 890 Q 960 1080 960 1030 V 1000'
      ];
      const route = `<svg class="story-route" viewBox="0 0 1080 1350" aria-hidden="true"><path d="${routes[n-1]}"></path>${n===5?'<circle cx="960" cy="1000" r="17"></circle>':''}</svg>`;
      app.innerHTML = `<main class="canvas carousel story-frame chapter-${n}" style="--story-accent:${item.storyAccent === '#F7781E' ? '#F7781E' : '#FEC221'}"><div class="story-photo"><img src="${master(`carousel-${item.id}-human.jpg`)}" alt=""></div>${carouselBrand}<div class="story-step" aria-label="Slide ${n} of ${item.slides.length}">${item.slides.map((_,i)=>`<i class="${i<n?'active':''}"></i>`).join('')}</div>${route}<section class="car-copy"><h1>${esc(slide.headline)}</h1><p class="car-body">${esc(slide.body)}</p>${slide.cta?`<span class="story-cta">${esc(slide.cta)}</span>`:''}</section><div class="story-topic">${esc(item.audience)}</div><div class="story-next">${n===item.slides.length?'Start the conversation ↗':'Keep going →'}</div><div class="story-signature">${oneBrand ? 'M2M One' : 'M2M Connectivity'} · Hybrid IoT</div></main>`;
    }

    function renderEmail(){
      const item = CAMPAIGN.emails.find(x => x.id === q.get('id')) || CAMPAIGN.emails[0];
      app.innerHTML = `<main class="canvas email-canvas"><div class="inbox-bar"><i></i><i></i><i></i><span style="margin-left:12px">Campaign email preview · ${esc(item.subject)}</span></div><section class="email-shell"><div class="email-art">${scene(item.master)}<div class="shade"></div><div class="art-line"><span>HYBRID IOT · WEEK ${item.week}</span>${esc(item.headline)}</div></div><div class="email-copy"><img class="email-logo" src="${logo}" alt="M2M Connectivity"><div class="email-kicker">${esc(item.segment)}</div><h1>${esc(item.headline)}</h1>${item.paragraphs.map(p => `<p>${esc(p)}</p>`).join('')}<ul>${item.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul><span class="email-button">${esc(item.cta)} →</span></div></section><div class="email-meta">Subject: ${esc(item.subject)} · Preheader: ${esc(item.preheader)}</div></main>`;
    }

    function renderWebsite(){
      const item = CAMPAIGN.website.find(x => x.id === q.get('id')) || CAMPAIGN.website[0];
      app.innerHTML = `<main class="canvas site-canvas"><div class="browser"><div class="browser-top"><i></i><i></i><i></i><div class="address">m2mone.com.au/hybrid-iot-readiness/</div></div><nav class="site-nav"><img src="${logo}" alt="M2M Connectivity"><div class="site-links"><span>Solutions</span><span>Products</span><span>Resources</span><span class="site-button">Talk to us</span></div></nav><section class="site-hero"><div class="site-content"><p class="eyebrow">${esc(item.eyebrow)}</p><h1>${esc(item.headline)}</h1><p>${esc(item.body)}</p><div class="site-actions"><span class="primary">${esc(item.cta)} →</span>${item.secondary ? `<span class="secondary">${esc(item.secondary)}</span>` : ''}</div><div class="site-facts"><div class="fact"><strong>LTE-M</strong>Cellular layer</div><div class="fact"><strong>Iridium SBD</strong>Satellite messaging</div><div class="fact"><strong>GNSS</strong>Positioning input</div></div></div><div class="site-image">${scene(item.master)}</div></section></div></main>`;
    }

    if(type === 'social') renderSocial();
    else if(type === 'carousel') renderCarousel();
    else if(type === 'email') renderEmail();
    else if(type === 'website') renderWebsite();
  </script>
</body>
</html>
