<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // SPA redirect for GitHub Pages
    // If the path starts with /crm/, redirect to /crm/ and let the React app handle routing
    var path = window.location.pathname;
    if (path.startsWith('/crm/') || path === '/crm') {
      // Preserve the path as a query param so the SPA can restore it
      var query = window.location.search;
      var hash = window.location.hash;
      window.location.replace('/crm/?p=' + encodeURIComponent(path.replace('/crm', '')) + (query ? '&q=' + encodeURIComponent(query) : '') + hash);
    } else {
      // For non-CRM 404s, redirect to the main site
      window.location.replace('/');
    }
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
